<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Edirne & Kırklareli Sayaç Saha Rehberi - TREDAŞ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-main: #0b1120;
      --bg-card: #111827;
      --bg-soft: #1e293b;
      --bg-input: #0f172a;
      --border: #475569;
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
      --accent: #f59e0b;
      --accent-2: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 10px 72px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 10px;
      position: sticky;
      top: 6px;
      z-index: 900;
    }

    .brand-row { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .badge-tredas {
      background: var(--accent);
      color: #090d16;
      font-weight: 900;
      font-size: 11px;
      padding: 5px 7px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .app-title { font-size: 14px; font-weight: 800; margin: 0; }
    .sub-status { font-size: 11px; color: #34d399; font-weight: 700; }

    .stats-pill {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .menu-btn {
      background: var(--bg-soft);
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .admin-box {
      border: 1px solid rgba(245, 158, 11, 0.55);
      background: rgba(245, 158, 11, 0.08);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .module-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .module-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .module-btn.active {
      background: rgba(245, 158, 11, 0.18);
      color: #fde68a;
      border-color: var(--accent);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .filter-stack { display: flex; flex-direction: column; gap: 8px; }

    select, input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--bg-input);
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }

    .job-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .err-card { border-color: rgba(239, 68, 68, 0.55); }
    .done-card { border-color: rgba(16, 185, 129, 0.55); }

    .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .job-title { font-size: 14px; font-weight: 800; color: #fbbf24; }
    .job-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

    .job-info-box {
      font-size: 13px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      margin-bottom: 10px;
    }

    .info-label { color: #fbbf24; font-weight: 700; }
    .reason-label { color: #34d399; font-weight: 800; }

    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary { background: var(--accent-2); border-color: var(--accent-2); color: #ffffff; }
    .btn-success { background: var(--success); border-color: var(--success); color: #062118; }
    .btn-secondary { background: var(--bg-soft); color: #ffffff; }
    .btn-warning { background: var(--accent); border-color: var(--accent); color: #111827; }

    .reason-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .reason-option-btn {
      background: var(--bg-input);
      color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .reason-option-btn.selected {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--success);
      color: #a7f3d0;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1200;
    }
    .modal-backdrop.open { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .status-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .empty-box {
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      color: var(--text-muted);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand-row">
        <span class="badge-tredas">TREDAŞ</span>
        <div>
          <h1 class="app-title">Saha & Hatalı Adres Okuyucu</h1>
          <div class="sub-status">🔒 Kilitli Yetkili Yükleme • Salt Okunur Excel</div>
        </div>
      </div>
      <div id="topCounter" class="stats-pill">0 Kayıt</div>
      <button id="menuBtn" class="menu-btn" title="Yetkili Girişi">⋮</button>
    </header>

    <section id="adminPanel" class="admin-box hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <strong>🔐 YETKİLİ PANELİ (KİLİT AÇIK)</strong>
        <button id="lockAdminBtn" class="btn btn-secondary" style="padding:5px 10px; font-size:12px;">🔒 Kilitle</button>
      </div>
      <div class="upload-grid">
        <label class="btn btn-primary" style="cursor:pointer;">
          📊 Saha Excel Oku
          <input type="file" id="sahaExcelInput" accept=".xlsx,.xls,.csv" hidden />
        </label>
        <label class="btn btn-warning" style="cursor:pointer;">
          ⚠️ Hatalı Adres Excel Oku
          <input type="file" id="faultExcelInput" accept=".xlsx,.xls,.csv" hidden />
        </label>
      </div>
      <div id="readStatus" class="status-note">Excel dosyası seçildiğinde yalnızca tarayıcıda okunur; dosyaya yazılmaz.</div>
    </section>

    <div class="module-switch">
      <button id="tabSahaBtn" class="module-btn active">📋 Saha Listesi (<span id="sahaCountBadge">0</span>)</button>
      <button id="tabFaultBtn" class="module-btn">⚠️ Hatalı Adres (<span id="faultCountBadge">0</span>) • ✓ (<span id="doneCountBadge">0</span>)</button>
    </div>

    <div id="sahaSection">
      <section class="card filter-stack">
        <select id="sahaGroupSelect">
          <option value="ALL">Tüm Planlama Grupları</option>
        </select>
        <input id="sahaSearchInput" type="text" placeholder="Tesisat No, Ekip, Adres veya Sayaç Seri ara..." />
      </section>
      <div id="sahaContainer"></div>
      <button id="sahaMoreBtn" class="btn btn-secondary hidden" style="width:100%;">Daha Fazla Göster</button>
    </div>

    <div id="faultSection" class="hidden">
      <div class="module-switch">
        <button id="subActiveBtn" class="module-btn active">⚠️ Bekleyen (<span id="subActiveCount">0</span>)</button>
        <button id="subDoneBtn" class="module-btn">✓ Tamamlananlar (<span id="subDoneCount">0</span>)</button>
      </div>

      <div id="faultActiveWrap">
        <section class="card filter-stack">
          <select id="faultPersonSelect">
            <option value="ALL">Tüm Ekipler / Personeller</option>
          </select>
          <input id="faultSearchInput" type="text" placeholder="Tesisat No, Ekip veya Adres ara..." />
        </section>
        <div id="faultContainer"></div>
        <button id="faultMoreBtn" class="btn btn-secondary hidden" style="width:100%;">Daha Fazla Göster</button>
      </div>

      <div id="faultDoneWrap" class="hidden">
        <div id="faultDoneContainer"></div>
      </div>
    </div>
  </div>

  <!-- Kilit / PIN Penceresi -->
  <div id="pinModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 style="margin-top:0;">🔒 Yetkili Kilit Girişi</h3>
      <p style="font-size:13px; color:var(--text-muted);">Excel okuma/yükleme panelini açmak için PIN girin.</p>
      <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN Kodu" style="margin-bottom:10px;" />
      <div style="display:flex; gap:8px;">
        <button id="pinSubmitBtn" class="btn btn-primary" style="flex:1;">Kilidi Aç</button>
        <button id="pinCloseBtn" class="btn btn-secondary" style="flex:1;">İptal</button>
      </div>
      <div id="pinError" style="color:var(--danger); font-size:12px; margin-top:8px;"></div>
    </div>
  </div>

  <!-- Tamamlama Nedeni Penceresi -->
  <div id="reasonModal" class="modal-backdrop">
    <div class="modal-card">
      <h3 style="margin-top:0;">Tamamlandı — Neden Seç</h3>
      <p id="reasonTargetText" style="font-size:12px; color:var(--text-muted);"></p>
      <div class="reason-grid">
        <button type="button" class="reason-option-btn" data-reason="Sarı Mühür">🟨 Sarı Mühür</button>
        <button type="button" class="reason-option-btn" data-reason="Kablo Hatası">🔌 Kablo Hatası</button>
        <button type="button" class="reason-option-btn" data-reason="Hata Giderildi">✅ Hata Giderildi</button>
        <button type="button" class="reason-option-btn" data-reason="Sayaç / Modem Değişti">🔁 Sayaç / Modem Değişti</button>
      </div>
      <input id="reasonCustomInput" type="text" placeholder="Neden yazın..." style="margin-bottom:10px;" />
      <div style="display:flex; gap:8px;">
        <button id="reasonConfirmBtn" class="btn btn-success" style="flex:1;">Tamamla ve Kaldır</button>
        <button id="reasonCancelBtn" class="btn btn-secondary" style="flex:1;">İptal</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "1923";
    const PAGE_SIZE = 40;

    let isUnlocked = false;
    let sahaRows = [];
    let filteredSaha = [];
    let sahaLimit = PAGE_SIZE;

    let faultRows = [];
    let completedFaults = [];
    let filteredFaults = [];
    let faultLimit = PAGE_SIZE;

    let pendingFaultId = null;
    let chosenReason = "";

    const el = {
      topCounter: document.getElementById("topCounter"),
      menuBtn: document.getElementById("menuBtn"),
      pinModal: document.getElementById("pinModal"),
      pinInput: document.getElementById("pinInput"),
      pinSubmitBtn: document.getElementById("pinSubmitBtn"),
      pinCloseBtn: document.getElementById("pinCloseBtn"),
      pinError: document.getElementById("pinError"),
      adminPanel: document.getElementById("adminPanel"),
      lockAdminBtn: document.getElementById("lockAdminBtn"),
      readStatus: document.getElementById("readStatus"),
      sahaExcelInput: document.getElementById("sahaExcelInput"),
      faultExcelInput: document.getElementById("faultExcelInput"),
      tabSahaBtn: document.getElementById("tabSahaBtn"),
      tabFaultBtn: document.getElementById("tabFaultBtn"),
      sahaCountBadge: document.getElementById("sahaCountBadge"),
      faultCountBadge: document.getElementById("faultCountBadge"),
      doneCountBadge: document.getElementById("doneCountBadge"),
      sahaSection: document.getElementById("sahaSection"),
      faultSection: document.getElementById("faultSection"),
      sahaGroupSelect: document.getElementById("sahaGroupSelect"),
      sahaSearchInput: document.getElementById("sahaSearchInput"),
      sahaContainer: document.getElementById("sahaContainer"),
      sahaMoreBtn: document.getElementById("sahaMoreBtn"),
      subActiveBtn: document.getElementById("subActiveBtn"),
      subDoneBtn: document.getElementById("subDoneBtn"),
      subActiveCount: document.getElementById("subActiveCount"),
      subDoneCount: document.getElementById("subDoneCount"),
      faultActiveWrap: document.getElementById("faultActiveWrap"),
      faultDoneWrap: document.getElementById("faultDoneWrap"),
      faultPersonSelect: document.getElementById("faultPersonSelect"),
      faultSearchInput: document.getElementById("faultSearchInput"),
      faultContainer: document.getElementById("faultContainer"),
      faultMoreBtn: document.getElementById("faultMoreBtn"),
      faultDoneContainer: document.getElementById("faultDoneContainer"),
      reasonModal: document.getElementById("reasonModal"),
      reasonTargetText: document.getElementById("reasonTargetText"),
      reasonCustomInput: document.getElementById("reasonCustomInput"),
      reasonConfirmBtn: document.getElementById("reasonConfirmBtn"),
      reasonCancelBtn: document.getElementById("reasonCancelBtn")
    };

    function openLockModal() {
      el.pinError.textContent = "";
      el.pinInput.value = "";
      el.pinModal.classList.add("open");
      el.pinInput.focus();
    }

    function lockPanel() {
      isUnlocked = false;
      el.adminPanel.classList.add("hidden");
    }

    el.menuBtn.addEventListener("click", () => {
      if (isUnlocked) {
        el.adminPanel.classList.toggle("hidden");
      } else {
        openLockModal();
      }
    });

    el.pinCloseBtn.addEventListener("click", () => el.pinModal.classList.remove("open"));

    el.pinSubmitBtn.addEventListener("click", () => {
      if (el.pinInput.value.trim() === ADMIN_PIN) {
        isUnlocked = true;
        el.pinModal.classList.remove("open");
        el.adminPanel.classList.remove("hidden");
      } else {
        el.pinError.textContent = "PIN hatalı.";
      }
    });

    el.pinInput.addEventListener("keydown", e => {
      if (e.key === "Enter") el.pinSubmitBtn.click();
    });

    el.lockAdminBtn.addEventListener("click", lockPanel);

    const norm = s => (s || "").toString().toLocaleLowerCase("tr-TR")
      .replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u")
      .replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c")
      .replace(/\s+/g, " ").trim();

    function pickVal(row, keys) {
      if (!row || typeof row !== "object") return "";
      for (const k of Object.keys(row)) {
        const nk = norm(k);
        if (keys.some(t => nk === norm(t) || nk.includes(norm(t)))) {
          const v = String(row[k] ?? "").trim();
          if (v && v.toLowerCase() !== "nan") return v;
        }
      }
      return "";
    }

    function parseCoords(raw) {
      const m = String(raw || "").trim().match(/^\s*(\d+[.,]\d+)\s*[-–]\s*(\d+[.,]\d+)\s*$/);
      if (!m) return null;
      const lat = parseFloat(m[1].replace(",", "."));
      const lng = parseFloat(m[2].replace(",", "."));
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      return { lat, lng };
    }

    function buildMapsHref(item) {
      if (item.coords) {
        return `https://www.google.com/maps/search/?api=1&query=${item.coords.lat},${item.coords.lng}`;
      }
      const q = `${item.adres || ""} ${item.planGrubu || ""} ${item.il || ""}`.trim();
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }

    function mapRow(raw, idx) {
      const tesisatNo = pickVal(raw, ["tesisat no", "tesisat", "abone"]);
      const ekip = pickVal(raw, ["ekip", "personel", "gorevli"]) || "Belirtilmemiş";
      const il = pickVal(raw, ["il", "sehir"]);
      const planGrubu = pickVal(raw, ["planlama grubu", "planlama", "grup", "ilce"]) || il || "Genel";
      const adres = pickVal(raw, ["adres", "mahalle", "sokak"]);
      const sayacMarka = pickVal(raw, ["sayac marka", "sayaç marka", "marka"]);
      const sayacSeri = pickVal(raw, ["sayac seri no", "sayac seri", "sayaç seri", "seri"]);
      const neden = pickVal(raw, ["endeks olmama nedeni", "neden", "ariza", "durum", "sutun1"]);
      const coordRaw = pickVal(raw, ["koordinat", "coord", "konum"]);
      return {
        id: `rec_${idx}_${Date.now()}`,
        tesisatNo,
        ekip,
        il,
        planGrubu,
        adres,
        sayacMarka,
        sayacSeri,
        neden,
        coords: parseCoords(coordRaw)
      };
    }

    function readWorkbookRows(arrayBuffer) {
      const wb = XLSX.read(arrayBuffer, { type: "array", raw: false });
      const sheetName = wb.SheetNames.includes("Tüm Tesisatlar")
        ? "Tüm Tesisatlar"
        : (wb.SheetNames.find(n => !norm(n).includes("ozet") && !norm(n).includes("pivot")) || wb.SheetNames[0]);
      const json = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "", raw: false });
      return {
        sheetName,
        items: json
          .map((r, i) => mapRow(r, i))
          .filter(x => x.tesisatNo || x.adres)
      };
    }

    function updateBadges() {
      el.sahaCountBadge.textContent = sahaRows.length;
      el.faultCountBadge.textContent = faultRows.length;
      el.doneCountBadge.textContent = completedFaults.length;
      el.subActiveCount.textContent = faultRows.length;
      el.subDoneCount.textContent = completedFaults.length;
      el.topCounter.textContent = `${sahaRows.length + faultRows.length} Kayıt`;
    }

    function renderSaha() {
      const grp = el.sahaGroupSelect.value;
      const q = norm(el.sahaSearchInput.value);
      filteredSaha = sahaRows.filter(x => {
        if (grp !== "ALL" && x.planGrubu !== grp) return false;
        if (q && !norm(`${x.tesisatNo} ${x.ekip} ${x.planGrubu} ${x.adres} ${x.sayacSeri}`).includes(q)) return false;
        return true;
      });

      if (!filteredSaha.length) {
        el.sahaContainer.innerHTML = `<div class="empty-box">Saha kaydı yok. Sağ üstteki ⋮ kilit menüsünden PIN girip Excel okutun.</div>`;
        el.sahaMoreBtn.classList.add("hidden");
        return;
      }

      const slice = filteredSaha.slice(0, sahaLimit);
      el.sahaContainer.innerHTML = slice.map(x => `
        <article class="job-card">
          <div class="job-top">
            <div class="job-title">Tesisat: ${x.tesisatNo || "-"} • ${x.ekip}</div>
          </div>
          <div class="job-meta">Grup: <strong>${x.planGrubu}</strong>${x.sayacSeri ? ` • Sayaç: <strong>${x.sayacSeri}</strong> (${x.sayacMarka || "-"})` : ""}</div>
          <div class="job-info-box">
            <div><span class="info-label">Adres:</span> ${x.adres || "-"}</div>
            ${x.neden ? `<div style="margin-top:4px; font-size:12px; color:#cbd5e1;"><span class="info-label">Not:</span> ${x.neden}</div>` : ""}
          </div>
          <div class="card-actions" style="grid-template-columns:1fr;">
            <a class="btn btn-primary" href="${buildMapsHref(x)}" target="_blank" rel="noopener noreferrer">🗺️ Adrese Git</a>
          </div>
        </article>
      `).join("");

      if (filteredSaha.length > sahaLimit) {
        el.sahaMoreBtn.classList.remove("hidden");
        el.sahaMoreBtn.textContent = `Daha Fazla Göster (${slice.length} / ${filteredSaha.length})`;
      } else {
        el.sahaMoreBtn.classList.add("hidden");
      }
    }

    function populateSahaGroups() {
      const groups = Array.from(new Set(sahaRows.map(x => x.planGrubu))).sort((a, b) => a.localeCompare(b, "tr"));
      el.sahaGroupSelect.innerHTML = `<option value="ALL">Tüm Planlama Grupları (${groups.length})</option>` +
        groups.map(g => `<option value="${g}">${g}</option>`).join("");
    }

    function populateFaultPersons() {
      const persons = Array.from(new Set(faultRows.map(x => x.ekip))).sort((a, b) => a.localeCompare(b, "tr"));
      el.faultPersonSelect.innerHTML = `<option value="ALL">Tüm Ekipler / Personeller (${persons.length})</option>` +
        persons.map(p => `<option value="${p}">${p}</option>`).join("");
    }

    function renderFaults() {
      const per = el.faultPersonSelect.value;
      const q = norm(el.faultSearchInput.value);
      filteredFaults = faultRows.filter(x => {
        if (per !== "ALL" && x.ekip !== per) return false;
        if (q && !norm(`${x.tesisatNo} ${x.ekip} ${x.planGrubu} ${x.adres} ${x.sayacSeri}`).includes(q)) return false;
        return true;
      });

      if (!filteredFaults.length) {
        el.faultContainer.innerHTML = `<div class="empty-box">Bekleyen hatalı kayıt yok.</div>`;
        el.faultMoreBtn.classList.add("hidden");
        return;
      }

      const slice = filteredFaults.slice(0, faultLimit);
      el.faultContainer.innerHTML = slice.map(x => `
        <article class="job-card err-card">
          <div class="job-top">
            <div class="job-title">Tesisat: ${x.tesisatNo || "-"} • ${x.ekip}</div>
          </div>
          <div class="job-meta">Grup: <strong>${x.planGrubu}</strong>${x.sayacSeri ? ` • Sayaç: <strong>${x.sayacSeri}</strong>` : ""}</div>
          <div class="job-info-box">
            <div><span class="info-label">Adres:</span> ${x.adres || "-"}</div>
            ${x.neden ? `<div style="margin-top:4px; font-size:12px; color:#cbd5e1;"><span class="info-label">Durum:</span> ${x.neden}</div>` : ""}
          </div>
          <div class="card-actions">
            <a class="btn btn-primary" href="${buildMapsHref(x)}" target="_blank" rel="noopener noreferrer">🗺️ Adrese Git</a>
            <button class="btn btn-success" onclick="openReason('${x.id}')">✓ Tamamlandı</button>
          </div>
        </article>
      `).join("");

      if (filteredFaults.length > faultLimit) {
        el.faultMoreBtn.classList.remove("hidden");
        el.faultMoreBtn.textContent = `Daha Fazla Göster (${slice.length} / ${filteredFaults.length})`;
      } else {
        el.faultMoreBtn.classList.add("hidden");
      }
    }

    function renderCompletedFaults() {
      if (!completedFaults.length) {
        el.faultDoneContainer.innerHTML = `<div class="empty-box">Henüz tamamlanan kayıt yok.</div>`;
        return;
      }
      el.faultDoneContainer.innerHTML = completedFaults.map(x => `
        <article class="job-card done-card">
          <div class="job-title">Tesisat: ${x.tesisatNo || "-"} • ${x.ekip}</div>
          <div class="job-meta">${x.completedAt || ""}</div>
          <div class="job-info-box">
            <div><span class="reason-label">Tamamlama Nedeni:</span> ${x.reason}</div>
            <div style="margin-top:4px;"><span class="info-label">Adres:</span> ${x.adres || "-"}</div>
          </div>
        </article>
      `).join("");
    }

    window.openReason = id => {
      const target = faultRows.find(x => x.id === id);
      if (!target) return;
      pendingFaultId = id;
      chosenReason = "";
      el.reasonCustomInput.value = "";
      document.querySelectorAll(".reason-option-btn").forEach(b => b.classList.remove("selected"));
      el.reasonTargetText.textContent = `Tesisat: ${target.tesisatNo || "-"} • ${target.ekip} • ${target.adres || ""}`;
      el.reasonModal.classList.add("open");
    };

    document.querySelectorAll(".reason-option-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".reason-option-btn").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        chosenReason = btn.dataset.reason;
        el.reasonCustomInput.value = chosenReason;
      });
    });

    el.reasonCancelBtn.addEventListener("click", () => {
      pendingFaultId = null;
      el.reasonModal.classList.remove("open");
    });

    el.reasonConfirmBtn.addEventListener("click", () => {
      if (!pendingFaultId) return;
      const reason = (el.reasonCustomInput.value || chosenReason || "").trim();
      if (!reason) { el.reasonCustomInput.focus(); return; }
      const item = faultRows.find(x => x.id === pendingFaultId);
      faultRows = faultRows.filter(x => x.id !== pendingFaultId);
      if (item) {
        completedFaults.unshift({ ...item, reason, completedAt: new Date().toLocaleString("tr-TR") });
      }
      pendingFaultId = null;
      el.reasonModal.classList.remove("open");
      updateBadges();
      populateFaultPersons();
      renderFaults();
      renderCompletedFaults();
    });

    el.sahaExcelInput.addEventListener("change", async e => {
      if (!isUnlocked) { openLockModal(); e.target.value = ""; return; }
      const file = e.target.files[0];
      if (!file) return;
      try {
        const res = readWorkbookRows(await file.arrayBuffer());
        sahaRows = res.items;
        sahaLimit = PAGE_SIZE;
        populateSahaGroups();
        updateBadges();
        renderSaha();
        el.readStatus.textContent = `✅ "${file.name}" (${res.sheetName}) okundu: ${sahaRows.length} kayıt (dosyaya yazılmadı).`;
      } catch (err) {
        el.readStatus.textContent = `❌ Okuma hatası: ${err.message}`;
      } finally { e.target.value = ""; }
    });

    el.faultExcelInput.addEventListener("change", async e => {
      if (!isUnlocked) { openLockModal(); e.target.value = ""; return; }
      const file = e.target.files[0];
      if (!file) return;
      try {
        const res = readWorkbookRows(await file.arrayBuffer());
        faultRows = res.items;
        faultLimit = PAGE_SIZE;
        populateFaultPersons();
        updateBadges();
        renderFaults();
        el.tabFaultBtn.click();
        el.readStatus.textContent = `✅ "${file.name}" (${res.sheetName}) hatalı listede okundu: ${faultRows.length} kayıt (dosyaya yazılmadı).`;
      } catch (err) {
        el.readStatus.textContent = `❌ Okuma hatası: ${err.message}`;
      } finally { e.target.value = ""; }
    });

    el.tabSahaBtn.addEventListener("click", () => {
      el.tabSahaBtn.classList.add("active");
      el.tabFaultBtn.classList.remove("active");
      el.sahaSection.classList.remove("hidden");
      el.faultSection.classList.add("hidden");
    });

    el.tabFaultBtn.addEventListener("click", () => {
      el.tabFaultBtn.classList.add("active");
      el.tabSahaBtn.classList.remove("active");
      el.faultSection.classList.remove("hidden");
      el.sahaSection.classList.add("hidden");
    });

    el.subActiveBtn.addEventListener("click", () => {
      el.subActiveBtn.classList.add("active");
      el.subDoneBtn.classList.remove("active");
      el.faultActiveWrap.classList.remove("hidden");
      el.faultDoneWrap.classList.add("hidden");
    });

    el.subDoneBtn.addEventListener("click", () => {
      el.subDoneBtn.classList.add("active");
      el.subActiveBtn.classList.remove("active");
      el.faultDoneWrap.classList.remove("hidden");
      el.faultActiveWrap.classList.add("hidden");
      renderCompletedFaults();
    });

    el.sahaGroupSelect.addEventListener("change", () => { sahaLimit = PAGE_SIZE; renderSaha(); });
    el.sahaSearchInput.addEventListener("input", () => { sahaLimit = PAGE_SIZE; renderSaha(); });
    el.sahaMoreBtn.addEventListener("click", () => { sahaLimit += PAGE_SIZE; renderSaha(); });

    el.faultPersonSelect.addEventListener("change", () => { faultLimit = PAGE_SIZE; renderFaults(); });
    el.faultSearchInput.addEventListener("input", () => { faultLimit = PAGE_SIZE; renderFaults(); });
    el.faultMoreBtn.addEventListener("click", () => { faultLimit += PAGE_SIZE; renderFaults(); });

    updateBadges();
    renderSaha();
    renderFaults();
  </script>
</body>
</html>
