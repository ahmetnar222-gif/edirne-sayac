<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Edirne Sayaç Saha Rehberi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding-bottom: 48px; }

    .header {
      background: linear-gradient(135deg, #101c3d 0%, #0d162f 100%);
      border-bottom: 1px solid #1e293b;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .badge-tredas {
      background-color: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 7px;
    }
    .header-title { font-size: 15px; font-weight: 700; line-height: 1.25; color: #f1f5f9; }
    .counter-pill {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
    }
    .counter-pill span { color: #10b981; font-weight: 800; }

    .container { max-width: 640px; margin: 0 auto; padding: 14px 14px 0; }

    .card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .btn-toggle-form {
      width: 100%;
      background-color: #172554;
      border: 1px solid #2563eb;
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .btn-toggle-form:last-child { margin-bottom: 0; }

    .btn-toggle-pdf {
      width: 100%;
      background-color: #064e3b;
      border: 1px solid #10b981;
      color: #a7f3d0;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .form-panel {
      margin-top: 8px;
      margin-bottom: 10px;
      padding-top: 12px;
      border-top: 1px solid #1f2937;
      display: none;
    }
    .form-panel.open { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-label { font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 4px; display: block; }

    .file-drop-box {
      background-color: #0f172a;
      border: 2px dashed #10b981;
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      margin-bottom: 10px;
    }
    .file-input {
      width: 100%;
      color: #e2e8f0;
      font-size: 12px;
      margin-top: 6px;
    }
    .scan-status {
      font-size: 12px;
      color: #6ee7b7;
      font-weight: 700;
      margin-top: 8px;
      min-height: 18px;
    }

    .region-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background-color: #0b1120;
      padding: 4px;
      border-radius: 11px;
      margin-bottom: 10px;
    }
    .region-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1.25;
    }
    .region-btn.active {
      background-color: #1e293b;
      color: #ffffff;
    }

    .select-box, .search-box, .input-box {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #263244;
      color: #e2e8f0;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      outline: none;
    }
    .select-box:focus, .search-box:focus, .input-box:focus { border-color: #3b82f6; }

    .btn-add-job {
      width: 100%;
      background-color: #f59e0b;
      border: none;
      color: #0f172a;
      font-size: 13px;
      font-weight: 800;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-clear-imported {
      width: 100%;
      background-color: #3f1219;
      border: 1px solid #991b1b;
      color: #fecaca;
      font-size: 12px;
      font-weight: 700;
      padding: 9px;
      border-radius: 10px;
      cursor: pointer;
    }

    .help-note {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.45;
      margin-bottom: 10px;
      background-color: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 8px 10px;
    }

    .chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .chip-btn {
      background-color: #0f172a;
      border: 1px solid #263244;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
    }
    .chip-btn.active {
      background-color: #172554;
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .progress-pct { color: #10b981; font-weight: 800; }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      width: 0%;
      transition: width 0.3s ease;
    }

    .job-list { display: flex; flex-direction: column; gap: 10px; }
    .job-card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
    }
    .job-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .job-id { font-size: 12px; font-weight: 700; color: #f59e0b; }
    .job-type {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: #1e293b;
      color: #93c5fd;
    }
    .job-meta { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .job-address { font-size: 13px; color: #e2e8f0; line-height: 1.4; margin-bottom: 10px; }

    .btn-map {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 10px;
      text-align: center;
      display: block;
      margin-bottom: 8px;
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .btn-action {
      width: 100%;
      border: none;
      font-size: 13px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-done {
      background-color: #10b981;
      color: #052e16;
      font-weight: 800;
    }
    .btn-abone-yok {
      background-color: #451a03;
      border: 1px solid #b45309;
      color: #fde68a;
      font-weight: 700;
    }
    .btn-delete-job {
      background-color: #2a1016;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      background-color: #111827;
      border: 1px dashed #334155;
      border-radius: 14px;
      color: #94a3b8;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #065f46;
      border: 1px solid #10b981;
      color: #ecfdf5;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="badge-tredas">TREDAŞ</div>
      <div class="header-title">Edirne Sayaç<br>Saha Rehberi</div>
    </div>
    <div class="counter-pill">İşlenen: <span id="doneCount">0</span> / <span id="totalCount">0</span></div>
  </div>

  <div class="container">
    <div class="card">
      <button class="btn-toggle-pdf" type="button" onclick="togglePdfPanel()">
        <span>📂 PDF Dosyası Yükle (Otomatik Tara &amp; Kaydet)</span>
        <span id="pdfArrow">▼</span>
      </button>

      <div class="form-panel" id="pdfPanel">
        <div class="help-note">
          PDF dosyasını seçtiğin anda sayfa içinde otomatik açılır, tüm sayfalar taranır ve tesisat/seri/adres kayıtları listeye kaydedilir. İstediğin kartı <b>Sil</b> butonuyla silebilirsin.
        </div>

        <div class="form-grid">
          <div>
            <label class="form-label">Varsayılan İlçe</label>
            <select id="pdfDefaultIlce" class="select-box">
              <option value="EDİRNE MERKEZ">EDİRNE MERKEZ</option>
              <option value="KEŞAN">KEŞAN</option>
              <option value="UZUNKÖPRÜ">UZUNKÖPRÜ</option>
              <option value="İPSALA">İPSALA</option>
              <option value="HAVSA">HAVSA</option>
              <option value="ENEZ">ENEZ</option>
              <option value="LALAPAŞA">LALAPAŞA</option>
              <option value="MERİÇ">MERİÇ</option>
              <option value="SÜLOĞLU">SÜLOĞLU</option>
            </select>
          </div>
          <div>
            <label class="form-label">Varsayılan Bölge</label>
            <select id="pdfDefaultBolge" class="select-box">
              <option value="MERKEZ">MERKEZ</option>
              <option value="KOY">KÖY / BELDE</option>
            </select>
          </div>
        </div>

        <div class="file-drop-box">
          <label class="form-label" for="pdfFileInput">PDF Dosyasını Seçin (.pdf)</label>
          <input
            type="file"
            id="pdfFileInput"
            class="file-input"
            accept=".pdf,application/pdf"
            onchange="handlePdfFileSelect(event)"
          />
          <div class="scan-status" id="pdfScanStatus"></div>
        </div>

        <button class="btn-clear-imported" type="button" onclick="clearImportedJobs()">🗑️ PDF / Manuel Eklenen Tüm Kayıtları Sil</button>
      </div>

      <button class="btn-toggle-form" type="button" onclick="toggleForm()">
        <span>➕ Yeni İş Emri Doldur / Ekle</span>
        <span id="formArrow">▼</span>
      </button>

      <div class="form-panel" id="formPanel">
        <div class="form-grid">
          <div>
            <label class="form-label">Tesisat No *</label>
            <input type="text" id="newTesisat" class="input-box" placeholder="Örn: 2000123456" />
          </div>
          <div>
            <label class="form-label">Mevcut Seri No *</label>
            <input type="text" id="newSeri" class="input-box" placeholder="Örn: LUN-40123456" />
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label class="form-label">İlçe</label>
            <select id="newIlce" class="select-box">
              <option value="EDİRNE MERKEZ">EDİRNE MERKEZ</option>
              <option value="KEŞAN">KEŞAN</option>
              <option value="UZUNKÖPRÜ">UZUNKÖPRÜ</option>
              <option value="İPSALA">İPSALA</option>
              <option value="HAVSA">HAVSA</option>
              <option value="ENEZ">ENEZ</option>
              <option value="LALAPAŞA">LALAPAŞA</option>
              <option value="MERİÇ">MERİÇ</option>
              <option value="SÜLOĞLU">SÜLOĞLU</option>
            </select>
          </div>
          <div>
            <label class="form-label">Bölge</label>
            <select id="newBolge" class="select-box">
              <option value="MERKEZ">MERKEZ</option>
              <option value="KOY">KÖY / BELDE</option>
            </select>
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label class="form-label">Mahalle / Köy *</label>
            <input type="text" id="newMahalle" class="input-box" placeholder="Örn: ŞÜKRÜPAŞA" />
          </div>
          <div>
            <label class="form-label">Sayaç Tipi</label>
            <select id="newTip" class="select-box">
              <option value="Monofaze">Monofaze</option>
              <option value="Trifaze">Trifaze</option>
            </select>
          </div>
        </div>

        <div>
          <label class="form-label">Açık Adres *</label>
          <input type="text" id="newAdres" class="input-box" placeholder="Mahalle, sokak, kapı/daire, ilçe..." />
        </div>

        <button class="btn-add-job" type="button" onclick="addNewJob()">✓ İş Emrini Listeye Ekle</button>
      </div>
    </div>

    <div class="card">
      <div class="region-tabs">
        <button class="region-btn active" data-region="ALL" onclick="setRegion('ALL', this)">Tümü</button>
        <button class="region-btn" data-region="MERKEZ" onclick="setRegion('MERKEZ', this)">📍 Merkez<br>Mahalleler</button>
        <button class="region-btn" data-region="KOY" onclick="setRegion('KOY', this)">🌾 Köyler /<br>Beldeler</button>
      </div>

      <select id="ilceSelect" class="select-box" onchange="onIlceChange()">
        <option value="ALL">Tüm İlçeler</option>
      </select>

      <select id="mahalleSelect" class="select-box" onchange="renderList()">
        <option value="ALL">Tüm Mahalle / Köyler</option>
      </select>

      <input type="text" id="searchInput" class="search-box" placeholder="Tesisat No, Seri No, Mahalle veya Sokak ara..." oninput="renderList()" />

      <div class="chip-row">
        <button class="chip-btn active" data-phase="ALL" onclick="setPhase('ALL', this)">Tüm Sayaçlar</button>
        <button class="chip-btn" data-phase="Monofaze" onclick="setPhase('Monofaze', this)">Monofaze</button>
        <button class="chip-btn" data-phase="Trifaze" onclick="setPhase('Trifaze', this)">Trifaze</button>
      </div>
    </div>

    <div class="card">
      <div class="progress-top">
        <span id="progressLabel">Ekranda Kalan İş: 0</span>
        <span class="progress-pct" id="progressPct">%0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="job-list" id="jobList"></div>
  </div>

  <div class="toast" id="toast">✓ Kaydedildi</div>

  <script>
    if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    (function hydrateJobs() {
      const FULL_DATA = [
        ["EDI-1-2000010188","EDİRNE MERKEZ","MERKEZ","1.MURAT","2000010188","Monofaze","LUN-40093226","1.MURAT MAH HASIM ISCAN SOK. NO: 18 DAIRE: MERKEZ/EDIRNE"],
        ["EDI-2-2000630061","EDİRNE MERKEZ","MERKEZ","1.MURAT","2000630061","Monofaze","BYL-271450612","1.MURAT MAH. 20._ SK. ÇAKIR-3 APARTMANI BLOK NO: 8 İÇ KAPI NO: Z11 MERKEZ / EDİRNE"],
        ["EDI-3-2000637825","EDİRNE MERKEZ","MERKEZ","1.MURAT","2000637825","Monofaze","LUN-18662948","1. MURAT MAH. İLHAMİ ERTEM CAD. DISKAPINO:28 NECDET/DAIRENO:DÜKKAN:11"],
        ["EDI-4-2000660002","EDİRNE MERKEZ","MERKEZ","1.MURAT","2000660002","Monofaze","BYL-20514396","1.MURAT MAH. 43. SK. - SİTESİ - BLOK NO: 2 İÇ KAPI NO: 11 MERKEZ / EDİRNE"],
        ["EDI-5-2000664213","EDİRNE MERKEZ","MERKEZ","1.MURAT","2000664213","Monofaze","LUN-103084068","1.MURAT MAH ILHAMI ERTEM SOK. NO: 28 NECDET ÖZER APT. DAIRE:A MERKEZ/EDIRNE"],
        ["EDI-6-2000665722","EDİRNE MERKEZ","MERKEZ","1.MURAT","2000665722","Trifaze","BYL-40137757","1. MURAT MAH. 44. SK. NO:7 ZEYNEP TAŞ-2 APT. ASANSÖR"],
        ["EDI-7-2000671434","EDİRNE MERKEZ","MERKEZ","1.MURAT","2000671434","Trifaze","LUN-302316380","ZÜBEYDE HANIM CAD. FIRAT SİT. C BL. DÜKKAN:2 VESTEL SERVİSİ EDIRNE"],
        ["EDI-8-2001144760","EDİRNE MERKEZ","MERKEZ","1.MURAT","2001144760","Monofaze","LUN-101830242","1.MURAT MAH ZÜBEYDE HANIM SOK. NO: 11 B FIRAT SITESI B BLOK DAIRE:9 MERKEZ/EDIRNE"],
        ["EDI-9-2001301993","EDİRNE MERKEZ","MERKEZ","1.MURAT","2001301993","Monofaze","LUN-103084152","1.MURAT MAH. 42. SK. NO: 19A İÇ KAPI NO: 1 MERKEZ / EDİRNE"],
        ["EDI-10-2001407480","EDİRNE MERKEZ","MERKEZ","1.MURAT","2001407480","Monofaze","LUN-40038358","1.MURAT MAH. İLHAMİ ERTEM CAD. NO: 28 İÇ KAPI NO: 3 MERKEZ / EDİRNE"]
      ];
      window.BASE_IS_EMIRLERI = FULL_DATA.map(r => ({
        id: r[0], ilce: r[1], bolge: r[2], mahalle: r[3], tesisat: r[4], tip: r[5], seri: r[6], adres: r[7], isCustom: false
      }));
    })();

    const STORAGE_PROCESSED = "tredas_edirne_islenen_v3";
    const STORAGE_CUSTOM_JOBS = "tredas_edirne_ozel_isler_v3";
    const STORAGE_DELETED_BASE = "tredas_edirne_silinen_base_v3";
    const DB_NAME = "TredasEdirneSahaDB_v3";
    const STORE_PROCESSED = "processedJobs";
    const STORE_CUSTOM = "customJobs";

    let processedMap = {};
    let customJobs = [];
    let deletedBaseIds = [];
    let currentRegion = "ALL";
    let currentPhase = "ALL";

    function getAllJobs() {
      const baseFiltered = (window.BASE_IS_EMIRLERI || []).filter(j => !deletedBaseIds.includes(j.id));
      return [...customJobs, ...baseFiltered];
    }

    function saveAllData() {
      try {
        localStorage.setItem(STORAGE_PROCESSED, JSON.stringify(processedMap));
        localStorage.setItem(STORAGE_CUSTOM_JOBS, JSON.stringify(customJobs));
        localStorage.setItem(STORAGE_DELETED_BASE, JSON.stringify(deletedBaseIds));
      } catch (e) {}

      if (window.indexedDB) {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_PROCESSED)) {
            db.createObjectStore(STORE_PROCESSED, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_CUSTOM)) {
            db.createObjectStore(STORE_CUSTOM, { keyPath: "id" });
          }
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx1 = db.transaction(STORE_PROCESSED, "readwrite");
          const s1 = tx1.objectStore(STORE_PROCESSED);
          s1.clear();
          Object.entries(processedMap).forEach(([id, info]) => s1.put({ id, ...info }));

          const tx2 = db.transaction(STORE_CUSTOM, "readwrite");
          const s2 = tx2.objectStore(STORE_CUSTOM);
          s2.clear();
          customJobs.forEach(j => s2.put(j));
        };
      }
    }

    function loadAllData() {
      try {
        const pRaw = localStorage.getItem(STORAGE_PROCESSED);
        if (pRaw) processedMap = JSON.parse(pRaw) || {};
        const cRaw = localStorage.getItem(STORAGE_CUSTOM_JOBS);
        if (cRaw) customJobs = JSON.parse(cRaw) || [];
        const dRaw = localStorage.getItem(STORAGE_DELETED_BASE);
        if (dRaw) deletedBaseIds = JSON.parse(dRaw) || [];
      } catch (e) {}

      if (window.indexedDB) {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_PROCESSED)) {
            db.createObjectStore(STORE_PROCESSED, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_CUSTOM)) {
            db.createObjectStore(STORE_CUSTOM, { keyPath: "id" });
          }
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction([STORE_PROCESSED, STORE_CUSTOM], "readonly");
          const r1 = tx.objectStore(STORE_PROCESSED).getAll();
          const r2 = tx.objectStore(STORE_CUSTOM).getAll();
          tx.oncomplete = () => {
            let changed = false;
            (r1.result || []).forEach(item => {
              if (!processedMap[item.id]) {
                processedMap[item.id] = { durum: item.durum, ts: item.ts };
                changed = true;
              }
            });
            const existingIds = new Set(customJobs.map(j => j.id));
            (r2.result || []).forEach(job => {
              if (!existingIds.has(job.id)) {
                customJobs.push(job);
                changed = true;
              }
            });
            if (changed) {
              saveAllData();
              populateIlceDropdown();
              populateMahalleDropdown();
              renderList();
            }
          };
        };
      }
    }

    function detectIlce(text, fallbackIlce) {
      const upper = text.toLocaleUpperCase("tr");
      const ilceler = [
        "EDİRNE MERKEZ", "KEŞAN", "UZUNKÖPRÜ", "İPSALA",
        "HAVSA", "ENEZ", "LALAPAŞA", "MERİÇ", "SÜLOĞLU"
      ];
      for (const il of ilceler) {
        if (upper.includes(il)) return il;
      }
      return fallbackIlce;
    }

    function detectBolge(text, fallbackBolge) {
      const upper = text.toLocaleUpperCase("tr");
      if (/\bKÖYÜ?\b|\bBELDESİ?\b|\bKOY\b/.test(upper)) return "KOY";
      if (/\bMAH\.?\b|\bMAHALLESİ\b|\bMERKEZ\b/.test(upper)) return "MERKEZ";
      return fallbackBolge;
    }

    function detectMahalle(text) {
      const upper = text.toLocaleUpperCase("tr");
      const mahMatch = upper.match(/([A-ZÇĞİÖŞÜ0-9.\-\s]{2,35}?)\s*(?:\bMAH\.?\b|\bMAHALLESİ\b)/);
      if (mahMatch && mahMatch[1]) {
        const cleaned = mahMatch[1].replace(/^\s*[,;:\-|/]+\s*/, "").trim();
        if (cleaned.length >= 2) return cleaned;
      }
      const koyMatch = upper.match(/([A-ZÇĞİÖŞÜ0-9.\-\s]{2,35}?)\s*(?:\bKÖYÜ?\b|\bBELDESİ?\b)/);
      if (koyMatch && koyMatch[1]) {
        const cleaned = koyMatch[1].replace(/^\s*[,;:\-|/]+\s*/, "").trim();
        if (cleaned.length >= 2) return cleaned;
      }
      return "GENEL";
    }

    function detectTip(text) {
      return /trifaze|3\s*faz|üç\s*faz/i.test(text) ? "Trifaze" : "Monofaze";
    }

    function parseSingleChunk(chunk, defaultIlce, defaultBolge) {
      const cleaned = chunk.replace(/\s+/g, " ").trim();
      if (!cleaned) return null;

      const tesisatMatch = cleaned.match(/\b(\d{7,15})\b/);
      if (!tesisatMatch) return null;
      const tesisat = tesisatMatch[1];

      const seriMatch = cleaned.match(/\b([A-ZÇĞİÖŞÜ]{2,6}[-_ ]?\d{4,12})\b/i);
      const seri = seriMatch ? seriMatch[1].toLocaleUpperCase("tr").replace(/\s+/g, "-") : "BİLİNMİYOR";

      const tip = detectTip(cleaned);
      const ilce = detectIlce(cleaned, defaultIlce);
      const bolge = detectBolge(cleaned, defaultBolge);
      const mahalle = detectMahalle(cleaned);

      return {
        id: "PDF-" + Date.now() + "-" + tesisat + "-" + Math.random().toString(36).slice(2, 6),
        ilce,
        bolge,
        mahalle,
        tesisat,
        tip,
        seri,
        adres: cleaned,
        isCustom: true
      };
    }

    async function extractTextFromPdfFile(file) {
      if (!window.pdfjsLib) {
        throw new Error("PDF okuyucu kütüphanesi yüklenemedi. İnternet bağlantını kontrol et.");
      }
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      let fullText = "";

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        let lastY = null;
        let lineText = "";

        for (const item of content.items) {
          if (!("str" in item)) continue;
          const y = item.transform ? Math.round(item.transform[5]) : null;
          if (lastY !== null && y !== null && Math.abs(y - lastY) > 4) {
            fullText += lineText.trim() + "\n";
            lineText = "";
          }
          lineText += item.str + " ";
          lastY = y;
        }
        if (lineText.trim()) {
          fullText += lineText.trim() + "\n";
        }
      }
      return fullText;
    }
