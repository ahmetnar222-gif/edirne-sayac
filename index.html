<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Edirne Sayaç Saha Rehberi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding-bottom: 56px; }

    .header {
      background: linear-gradient(135deg, #101c3d 0%, #0d162f 100%);
      border-bottom: 1px solid #1e293b;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .badge-tredas {
      background-color: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 7px;
    }
    .header-title { font-size: 15px; font-weight: 700; line-height: 1.25; color: #f1f5f9; }
    .counter-pill {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
    }
    .counter-pill span { color: #10b981; font-weight: 800; }

    .container { max-width: 640px; margin: 0 auto; padding: 14px 14px 0; }

    .card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .form-header-title {
      width: 100%;
      background-color: #172554;
      border: 1px solid #2563eb;
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-panel {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1f2937;
      display: block;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-label { font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 4px; display: block; }

    .region-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background-color: #0b1120;
      padding: 4px;
      border-radius: 11px;
      margin-bottom: 10px;
    }
    .region-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1.25;
    }
    .region-btn.active {
      background-color: #1e293b;
      color: #ffffff;
    }

    .select-box, .search-box, .input-box {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #263244;
      color: #e2e8f0;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      outline: none;
    }
    .select-box:focus, .search-box:focus, .input-box:focus { border-color: #3b82f6; }

    .btn-add-job {
      width: 100%;
      background-color: #f59e0b;
      border: none;
      color: #0f172a;
      font-size: 13px;
      font-weight: 800;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-add-job:active { transform: scale(0.98); }

    .chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .chip-btn {
      background-color: #0f172a;
      border: 1px solid #263244;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
    }
    .chip-btn.active {
      background-color: #172554;
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .progress-pct { color: #10b981; font-weight: 800; }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      width: 0%;
      transition: width 0.3s ease;
    }

    .job-list { display: flex; flex-direction: column; gap: 10px; }
    .job-card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
    }
    .job-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .job-id { font-size: 12px; font-weight: 700; color: #f59e0b; }
    .job-type {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: #1e293b;
      color: #93c5fd;
    }
    .job-meta { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .job-address { font-size: 13px; color: #e2e8f0; line-height: 1.4; margin-bottom: 10px; }

    .btn-map {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 10px;
      text-align: center;
      display: block;
      margin-bottom: 8px;
    }

    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .action-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .btn-action {
      width: 100%;
      border: none;
      font-size: 13px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-done {
      background-color: #10b981;
      color: #052e16;
      font-weight: 800;
    }
    .btn-abone-yok {
      background-color: #451a03;
      border: 1px solid #b45309;
      color: #fde68a;
      font-weight: 700;
    }
    .btn-edit {
      background-color: #1e3a8a;
      border: 1px solid #3b82f6;
      color: #dbeafe;
      font-weight: 700;
    }
    .btn-delete {
      background-color: #450a0a;
      border: 1px solid #dc2626;
      color: #fecaca;
      font-weight: 700;
    }

    .edit-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #1f2937;
    }

    .processed-section-title {
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .processed-item {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .processed-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .status-badge-done {
      background-color: #064e3b;
      color: #6ee7b7;
      border: 1px solid #10b981;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .status-badge-abone {
      background-color: #451a03;
      color: #fde68a;
      border: 1px solid #d97706;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .btn-undo {
      background-color: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      background-color: #111827;
      border: 1px dashed #334155;
      border-radius: 14px;
      color: #94a3b8;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #065f46;
      border: 1px solid #10b981;
      color: #ecfdf5;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="badge-tredas">TREDAŞ</div>
      <div class="header-title">Edirne Sayaç<br>Saha Rehberi</div>
    </div>
    <div class="counter-pill">İşlenen: <span id="doneCount">0</span> / <span id="totalCount">0</span></div>
  </div>

  <div class="container">
    <div class="card">
      <div class="form-header-title">
        <span>➕ Yeni İş Emri Doldur / Ekle</span>
        <span>AÇIK</span>
      </div>

      <div class="form-panel" id="formPanel">
        <div class="form-grid">
          <div>
            <label class="form-label">Tesisat No *</label>
            <input type="text" id="newTesisat" class="input-box" placeholder="Örn: 2000123456" />
          </div>
          <div>
            <label class="form-label">Mevcut Seri No *</label>
            <input type="text" id="newSeri" class="input-box" placeholder="Örn: LUN-40123456" />
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label class="form-label">İlçe</label>
            <select id="newIlce" class="select-box">
              <option value="EDİRNE MERKEZ">EDİRNE MERKEZ</option>
              <option value="KEŞAN">KEŞAN</option>
              <option value="UZUNKÖPRÜ">UZUNKÖPRÜ</option>
              <option value="İPSALA">İPSALA</option>
              <option value="HAVSA">HAVSA</option>
              <option value="ENEZ">ENEZ</option>
              <option value="LALAPAŞA">LALAPAŞA</option>
              <option value="MERİÇ">MERİÇ</option>
              <option value="SÜLOĞLU">SÜLOĞLU</option>
            </select>
          </div>
          <div>
            <label class="form-label">Bölge</label>
            <select id="newBolge" class="select-box">
              <option value="MERKEZ">MERKEZ</option>
              <option value="KOY">KÖY / BELDE</option>
            </select>
          </div>
        </div>

        <div class="form-grid">
          <div>
            <label class="form-label">Mahalle / Köy *</label>
            <input type="text" id="newMahalle" class="input-box" placeholder="Örn: ŞÜKRÜPAŞA" />
          </div>
          <div>
            <label class="form-label">Sayaç Tipi</label>
            <select id="newTip" class="select-box">
              <option value="Monofaze">Monofaze</option>
              <option value="Trifaze">Trifaze</option>
            </select>
          </div>
        </div>

        <div>
          <label class="form-label">Açık Adres *</label>
          <input type="text" id="newAdres" class="input-box" placeholder="Mahalle, sokak, kapı/daire, ilçe..." />
        </div>

        <button class="btn-add-job" type="button" onclick="addNewJob()">✓ İş Emrini Listeye Ekle</button>
      </div>
    </div>

    <div class="card">
      <div class="region-tabs">
        <button class="region-btn active" data-region="ALL" onclick="setRegion('ALL', this)">Tümü</button>
        <button class="region-btn" data-region="MERKEZ" onclick="setRegion('MERKEZ', this)">📍 Merkez<br>Mahalleler</button>
        <button class="region-btn" data-region="KOY" onclick="setRegion('KOY', this)">🌾 Köyler /<br>Beldeler</button>
      </div>

      <select id="ilceSelect" class="select-box" onchange="onIlceChange()">
        <option value="ALL">Tüm İlçeler</option>
      </select>

      <select id="mahalleSelect" class="select-box" onchange="renderList()">
        <option value="ALL">Tüm Mahalle / Köyler</option>
      </select>

      <input type="text" id="searchInput" class="search-box" placeholder="Tesisat No, Seri No, Mahalle veya Sokak ara..." oninput="renderList()" />

      <div class="chip-row">
        <button class="chip-btn active" data-phase="ALL" onclick="setPhase('ALL', this)">Tüm Sayaçlar</button>
        <button class="chip-btn" data-phase="Monofaze" onclick="setPhase('Monofaze', this)">Monofaze</button>
        <button class="chip-btn" data-phase="Trifaze" onclick="setPhase('Trifaze', this)">Trifaze</button>
      </div>
    </div>

    <div class="card">
      <div class="progress-top">
        <span id="progressLabel">Ekranda Kalan İş: 0</span>
        <span class="progress-pct" id="progressPct">%0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="job-list" id="jobList"></div>

    <div class="card" style="margin-top: 14px;">
      <div class="processed-section-title">
        <span>✅ İşlenen Kayıtlar (Tamamlandı / Abone Yok)</span>
        <span id="processedBadgeCount" style="color:#10b981;">0</span>
      </div>
      <div id="processedList"></div>
    </div>
  </div>

  <div class="toast" id="toast">✓ Kaydedildi</div>

        id: "EDI-21-2000184478",
        ilce: "EDİRNE MERKEZ",
        bolge: "MERKEZ",
        mahalle: "ABDURRAHMAN",
        tesisat: "2000184478",
        tip: "Monofaze",
        seri: "LUN-40086577",
        adres: "ABDURRAHMAN MAH. ÇİFTEKAPI SK. NO: 21 İÇ KAPI NO: 0 MERKEZ / EDİRNE"
      },
      {
        id: "EDI-22-2000184563",
        ilce: "EDİRNE MERKEZ",
        bolge: "MERKEZ",
        mahalle: "ABDURRAHMAN",
        tesisat: "2000184563",
        tip: "Trifaze",
        seri: "LUN-302437282",
        adres: "ABDURRAHMAN MAH. ÇİFTEKAPI SK. NO: 23 İÇ KAPI NO: 0 MERKEZ / EDİRNE"
      }
    ];

    const STORAGE_PROCESSED = "tredas_edirne_islenen_v4";
    const STORAGE_CUSTOM_JOBS = "tredas_edirne_ozel_isler_v4";
    const STORAGE_OVERRIDES = "tredas_edirne_duzenlenenler_v4";
    const STORAGE_DELETED = "tredas_edirne_silinenler_v4";
    const DB_NAME = "TredasEdirneSahaDB_v4";
    const STORE_PROCESSED = "processedJobs";
    const STORE_CUSTOM = "customJobs";
    const STORE_OVERRIDES = "overrideJobs";
    const STORE_DELETED = "deletedJobIds";

    let processedMap = {};
    let customJobs = [];
    let overrideMap = {};
    let deletedIds = [];
    let currentRegion = "ALL";
    let currentPhase = "ALL";

    function getAllJobs() {
      const deletedSet = new Set(deletedIds);
      const mergedBase = BASE_IS_EMIRLERI
        .filter(j => !deletedSet.has(j.id))
        .map(j => overrideMap[j.id] ? { ...j, ...overrideMap[j.id], id: j.id } : j);

      const mergedCustom = customJobs
        .filter(j => !deletedSet.has(j.id))
        .map(j => overrideMap[j.id] ? { ...j, ...overrideMap[j.id], id: j.id } : j);

      return [...mergedCustom, ...mergedBase];
    }

    function saveAllData() {
      try {
        localStorage.setItem(STORAGE_PROCESSED, JSON.stringify(processedMap));
        localStorage.setItem(STORAGE_CUSTOM_JOBS, JSON.stringify(customJobs));
        localStorage.setItem(STORAGE_OVERRIDES, JSON.stringify(overrideMap));
        localStorage.setItem(STORAGE_DELETED, JSON.stringify(deletedIds));
      } catch (e) {}

      if (window.indexedDB) {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_PROCESSED)) {
            db.createObjectStore(STORE_PROCESSED, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_CUSTOM)) {
            db.createObjectStore(STORE_CUSTOM, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_OVERRIDES)) {
            db.createObjectStore(STORE_OVERRIDES, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_DELETED)) {
            db.createObjectStore(STORE_DELETED, { keyPath: "id" });
          }
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction([STORE_PROCESSED, STORE_CUSTOM, STORE_OVERRIDES, STORE_DELETED], "readwrite");

          const s1 = tx.objectStore(STORE_PROCESSED);
          s1.clear();
          Object.entries(processedMap).forEach(([id, info]) => s1.put({ id, ...info }));

          const s2 = tx.objectStore(STORE_CUSTOM);
          s2.clear();
          customJobs.forEach(j => s2.put(j));

          const s3 = tx.objectStore(STORE_OVERRIDES);
          s3.clear();
          Object.entries(overrideMap).forEach(([id, data]) => s3.put({ id, ...data }));

          const s4 = tx.objectStore(STORE_DELETED);
          s4.clear();
          deletedIds.forEach(id => s4.put({ id }));
        };
      }
    }

    function loadAllData() {
      try {
        const pRaw = localStorage.getItem(STORAGE_PROCESSED);
        if (pRaw) processedMap = JSON.parse(pRaw) || {};
        const cRaw = localStorage.getItem(STORAGE_CUSTOM_JOBS);
        if (cRaw) customJobs = JSON.parse(cRaw) || [];
        const oRaw = localStorage.getItem(STORAGE_OVERRIDES);
        if (oRaw) overrideMap = JSON.parse(oRaw) || {};
        const dRaw = localStorage.getItem(STORAGE_DELETED);
        if (dRaw) deletedIds = JSON.parse(dRaw) || [];
      } catch (e) {}

      if (window.indexedDB) {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_PROCESSED)) {
            db.createObjectStore(STORE_PROCESSED, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_CUSTOM)) {
            db.createObjectStore(STORE_CUSTOM, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_OVERRIDES)) {
            db.createObjectStore(STORE_OVERRIDES, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_DELETED)) {
            db.createObjectStore(STORE_DELETED, { keyPath: "id" });
          }
        };
        req.onsuccess = (e) => {
          const db = e.target.result;
          const tx = db.transaction([STORE_PROCESSED, STORE_CUSTOM, STORE_OVERRIDES, STORE_DELETED], "readonly");
          const r1 = tx.objectStore(STORE_PROCESSED).getAll();
          const r2 = tx.objectStore(STORE_CUSTOM).getAll();
          const r3 = tx.objectStore(STORE_OVERRIDES).getAll();
          const r4 = tx.objectStore(STORE_DELETED).getAll();
          tx.oncomplete = () => {
            let changed = false;
            (r1.result || []).forEach(item => {
              if (!processedMap[item.id]) {
                processedMap[item.id] = { durum: item.durum, ts: item.ts };
                changed = true;
              }
            });
            const existingIds = new Set(customJobs.map(j => j.id));
            (r2.result || []).forEach(job => {
              if (!existingIds.has(job.id)) {
                customJobs.push(job);
                changed = true;
              }
            });
            (r3.result || []).forEach(ov => {
              if (!overrideMap[ov.id]) {
                overrideMap[ov.id] = ov;
                changed = true;
              }
            });
            const delSet = new Set(deletedIds);
            (r4.result || []).forEach(d => {
              if (!delSet.has(d.id)) {
                deletedIds.push(d.id);
                changed = true;
              }
            });
            if (changed) {
              saveAllData();
              populateIlceDropdown();
              populateMahalleDropdown();
              renderList();
            }
          };
        };
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
    }

    function addNewJob() {
      const tesisat = document.getElementById("newTesisat").value.trim();
      const seri = document.getElementById("newSeri").value.trim();
      const ilce = document.getElementById("newIlce").value;
      const bolge = document.getElementById("newBolge").value;
      const mahalle = document.getElementById("newMahalle").value.trim().toLocaleUpperCase("tr");
      const tip = document.getElementById("newTip").value;
      const adres = document.getElementById("newAdres").value.trim();

      if (!tesisat || !seri || !mahalle || !adres) {
        alert("Lütfen Tesisat No, Seri No, Mahalle/Köy ve Açık Adres alanlarını doldurun.");
        return;
      }

      const job = {
        id: "MAN-" + Date.now() + "-" + tesisat,
        ilce,
        bolge,
        mahalle,
        tesisat,
        tip,
        seri,
        adres
      };

      customJobs.unshift(job);
      saveAllData();
      populateIlceDropdown();
      populateMahalleDropdown();
      renderList();

      document.getElementById("newTesisat").value = "";
      document.getElementById("newSeri").value = "";
      document.getElementById("newMahalle").value = "";
      document.getElementById("newAdres").value = "";

      showToast("✓ Yeni iş emri eklendi");
    }

    function saveEditedJob(id) {
      const tesisat = document.getElementById("edit_tesisat_" + id).value.trim();
      const seri = document.getElementById("edit_seri_" + id).value.trim();
      const mahalle = document.getElementById("edit_mahalle_" + id).value.trim().toLocaleUpperCase("tr");
      const tip = document.getElementById("edit_tip_" + id).value.trim();
      const adres = document.getElementById("edit_adres_" + id).value.trim();

      if (!tesisat || !seri || !mahalle || !adres) {
        alert("Düzenleme için Tesisat No, Seri No, Mahalle/Köy ve Açık Adres boş bırakılamaz.");
        return;
      }

      overrideMap[id] = {
        ...(overrideMap[id] || {}),
        id,
        tesisat,
        seri,
        mahalle,
        tip,
        adres
      };

      customJobs = customJobs.map(j => j.id === id ? { ...j, tesisat, seri, mahalle, tip, adres } : j);

      saveAllData();
      populateIlceDropdown();
      populateMahalleDropdown();
      renderList();
      showToast("✓ Kayıt güncellendi");
    }

    function deleteJob(id) {
      if (!confirm("Bu kaydı silmek istediğine emin misin?")) return;
      customJobs = customJobs.filter(j => j.id !== id);
      delete overrideMap[id];
      delete processedMap[id];
      if (!deletedIds.includes(id)) {
        deletedIds.push(id);
      }
      saveAllData();
      populateIlceDropdown();
      populateMahalleDropdown();
      renderList();
      showToast("✓ Kayıt silindi");
    }

    function markJobStatus(id, durum) {
      processedMap[id] = { durum, ts: Date.now() };
      saveAllData();
      showToast("✓ Kaydedildi: " + durum);
      renderList();
    }

    function undoJobStatus(id) {
      delete processedMap[id];
      saveAllData();
      showToast("↩ Bekleyen işlere geri alındı");
      renderList();
    }

    function setRegion(region, btn) {
      currentRegion = region;
      document.querySelectorAll(".region-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      populateMahalleDropdown();
      renderList();
    }

    function setPhase(phase, btn) {
      currentPhase = phase;
      document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderList();
    }

    function populateIlceDropdown() {
      const sel = document.getElementById("ilceSelect");
      const prev = sel.value;
      const ilceler = [...new Set(getAllJobs().map(j => j.ilce))].sort((a, b) => a.localeCompare(b, "tr"));
      sel.innerHTML = '<option value="ALL">Tüm İlçeler</option>';
      ilceler.forEach(il => {
        const opt = document.createElement("option");
        opt.value = il;
        opt.textContent = il;
        sel.appendChild(opt);
      });
      if (ilceler.includes(prev)) sel.value = prev;
    }

    function onIlceChange() {
      populateMahalleDropdown();
      renderList();
    }

    function populateMahalleDropdown() {
      const sel = document.getElementById("mahalleSelect");
      const prev = sel.value;
      const selectedIlce = document.getElementById("ilceSelect").value;
      const filtered = getAllJobs().filter(j => {
        if (selectedIlce !== "ALL" && j.ilce !== selectedIlce) return false;
        if (currentRegion !== "ALL" && j.bolge !== currentRegion) return false;
        return true;
      });
      const mahalleler = [...new Set(filtered.map(j => j.mahalle))].sort((a, b) => a.localeCompare(b, "tr"));
      sel.innerHTML = '<option value="ALL">Tüm Mahalle / Köyler</option>';
      mahalleler.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        sel.appendChild(opt);
      });
      if (mahalleler.includes(prev)) sel.value = prev;
    }

    function escapeAttr(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderProcessedList(allJobs) {
      const listEl = document.getElementById("processedList");
      const badgeEl = document.getElementById("processedBadgeCount");
      const processedItems = allJobs
        .filter(item => Boolean(processedMap[item.id]))
        .sort((a, b) => (processedMap[b.id]?.ts || 0) - (processedMap[a.id]?.ts || 0));

      badgeEl.textContent = processedItems.length;

      if (processedItems.length === 0) {
        listEl.innerHTML = '<div style="color:#94a3b8; font-size:13px; padding:8px 2px;">Henüz işlenen kayıt yok.</div>';
        return;
      }

      listEl.innerHTML = processedItems.map(item => {
        const info = processedMap[item.id];
        const isDone = info.durum === "Tamamlandı";
        const badgeClass = isDone ? "status-badge-done" : "status-badge-abone";
        return `
          <div class="processed-item">
            <div class="processed-top">
              <span style="font-size:12px; font-weight:700; color:#f59e0b;">Tesisat: ${item.tesisat} (${item.seri})</span>
              <span class="${badgeClass}">${info.durum}</span>
            </div>
            <div style="font-size:12px; color:#cbd5e1; margin-bottom:6px;">${item.ilce} / ${item.mahalle} — ${item.adres}</div>
            <div style="display:flex; gap:6px; justify-content:flex-end;">
              <button class="btn-undo" type="button" onclick="undoJobStatus('${item.id}')">↩ Geri Al</button>
              <button class="btn-undo" style="border-color:#dc2626; color:#fecaca;" type="button" onclick="deleteJob('${item.id}')">🗑 Sil</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderList() {
      const allJobs = getAllJobs();
      const selectedIlce = document.getElementById("ilceSelect").value;
      const selectedMahalle = document.getElementById("mahalleSelect").value;
      const query = document.getElementById("searchInput").value.trim().toLocaleLowerCase("tr");

      const total = allJobs.length;
      const done = allJobs.filter(j => Boolean(processedMap[j.id])).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById("doneCount").textContent = done;
      document.getElementById("totalCount").textContent = total;
      document.getElementById("progressPct").textContent = "%" + pct;
      document.getElementById("progressFill").style.width = pct + "%";

      renderProcessedList(allJobs);

      const visible = allJobs.filter(item => {
        if (processedMap[item.id]) return false;
        if (selectedIlce !== "ALL" && item.ilce !== selectedIlce) return false;
        if (currentRegion !== "ALL" && item.bolge !== currentRegion) return false;
        if (selectedMahalle !== "ALL" && item.mahalle !== selectedMahalle) return false;
        if (currentPhase !== "ALL" && item.tip !== currentPhase) return false;
        if (query) {
          const hay = (item.tesisat + " " + item.seri + " " + item.ilce + " " + item.mahalle + " " + item.adres).toLocaleLowerCase("tr");
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      document.getElementById("progressLabel").textContent = "Ekranda Kalan İş: " + visible.length;

      const listEl = document.getElementById("jobList");
      if (visible.length === 0) {
        listEl.innerHTML = '<div class="empty-state">🎉 Bu filtrede bekleyen iş kalmadı!</div>';
        return;
      }

      listEl.innerHTML = visible.map(item => {
        const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.adres);
        return `
          <div class="job-card">
            <div class="job-top">
              <span class="job-id">Tesisat: ${item.tesisat}</span>
              <span class="job-type">${item.tip}</span>
            </div>
            <div class="job-meta">Seri No: <strong>${item.seri}</strong> • ${item.ilce} / ${item.mahalle}</div>
            <div class="job-address">📍 ${item.adres}</div>
            <a class="btn-map" href="${mapsUrl}" target="_blank" rel="noopener">🗺️ Haritada Göster</a>
            <div class="action-stack">
              <button class="btn-action btn-done" type="button" onclick="markJobStatus('${item.id}', 'Tamamlandı')">✓ İşi Tamamla</button>
              <button class="btn-action btn-abone-yok" type="button" onclick="markJobStatus('${item.id}', 'Abone Yok / Kapalı')">🚪 Abone Yok / Kapalı</button>
              <div class="action-row-2">
                <button class="btn-action btn-edit" type="button" onclick="saveEditedJob('${item.id}')">✎ Değişiklik Kaydet</button>
                <button class="btn-action btn-delete" type="button" onclick="deleteJob('${item.id}')">🗑 Kaydı Sil</button>
              </div>
            </div>

            <div class="edit-box">
              <div class="form-grid">
                <div>
                  <label class="form-label">Tesisat No</label>
                  <input type="text" id="edit_tesisat_${item.id}" class="input-box" style="margin-bottom:6px;" value="${escapeAttr(item.tesisat)}" />
                </div>
                <div>
                  <label class="form-label">Seri No</label>
                  <input type="text" id="edit_seri_${item.id}" class="input-box" style="margin-bottom:6px;" value="${escapeAttr(item.seri)}" />
                </div>
              </div>
              <div class="form-grid">
                <div>
                  <label class="form-label">Mahalle / Köy</label>
                  <input type="text" id="edit_mahalle_${item.id}" class="input-box" style="margin-bottom:6px;" value="${escapeAttr(item.mahalle)}" />
                </div>
                <div>
                  <label class="form-label">Tip</label>
                  <input type="text" id="edit_tip_${item.id}" class="input-box" style="margin-bottom:6px;" value="${escapeAttr(item.tip)}" />
                </div>
              </div>
              <div>
                <label class="form-label">Açık Adres</label>
                <input type="text" id="edit_adres_${item.id}" class="input-box" style="margin-bottom:8px;" value="${escapeAttr(item.adres)}" />
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    loadAllData();
    populateIlceDropdown();
    populateMahalleDropdown();
    renderList();
  </script>
</body>
</html>
