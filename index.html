<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Edirne Sayaç Saha Rehberi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; padding-bottom: 56px; }

    .header {
      background: linear-gradient(135deg, #101c3d 0%, #0d162f 100%);
      border-bottom: 1px solid #1e293b;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .badge-tredas {
      background-color: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 7px;
      flex-shrink: 0;
    }
    .header-title { font-size: 14px; font-weight: 700; line-height: 1.2; color: #f1f5f9; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .counter-pill {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
    }
    .counter-pill span { color: #10b981; font-weight: 800; }
    .btn-menu {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-menu.admin-active {
      border-color: #10b981;
      color: #6ee7b7;
      background-color: #064e3b;
    }

    .container { max-width: 640px; margin: 0 auto; padding: 14px 14px 0; }

    .card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .admin-drawer {
      display: none;
      background-color: #111827;
      border: 1px solid #2563eb;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .admin-drawer.open { display: block; }
    .admin-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .admin-badge { font-size: 12px; font-weight: 800; color: #93c5fd; }
    .btn-logout {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #fca5a5;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .upload-box {
      background-color: #0f172a;
      border: 2px dashed #10b981;
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }
    .upload-box.excel-box { border-color: #3b82f6; }
    .upload-title {
      font-size: 12px;
      font-weight: 800;
      color: #a7f3d0;
      margin-bottom: 6px;
      display: block;
      line-height: 1.3;
    }
    .upload-box.excel-box .upload-title { color: #93c5fd; }
    .file-input { width: 100%; color: #e2e8f0; font-size: 11px; }

    .manual-box {
      background-color: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .manual-title {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .manual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-add-manual {
      width: 100%;
      background-color: #2563eb;
      border: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      padding: 9px;
      border-radius: 9px;
      cursor: pointer;
      margin-top: 2px;
    }

    .btn-reset-all {
      width: 100%;
      background-color: #450a0a;
      border: 1px solid #991b1b;
      color: #fecaca;
      font-size: 12px;
      font-weight: 800;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .scan-status {
      font-size: 12px;
      color: #6ee7b7;
      font-weight: 700;
      margin-top: 8px;
      text-align: center;
      min-height: 16px;
    }

    .region-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background-color: #0b1120;
      padding: 4px;
      border-radius: 11px;
      margin-bottom: 10px;
    }
    .region-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      line-height: 1.25;
    }
    .region-btn.active { background-color: #1e293b; color: #ffffff; }

    .select-box, .search-box, .mini-input {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #263244;
      color: #e2e8f0;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      outline: none;
    }
    .mini-input { font-size: 12px; padding: 8px 10px; }
    .select-box:focus, .search-box:focus, .mini-input:focus { border-color: #3b82f6; }

    .chip-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .chip-btn {
      background-color: #0f172a;
      border: 1px solid #263244;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
    }
    .chip-btn.active {
      background-color: #172554;
      border-color: #3b82f6;
      color: #93c5fd;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .progress-pct { color: #10b981; font-weight: 800; }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      width: 0%;
      transition: width 0.3s ease;
    }

    .job-list { display: flex; flex-direction: column; gap: 10px; }
    .job-card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
    }
    .job-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .job-id { font-size: 12px; font-weight: 700; color: #f59e0b; }
    .job-type {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background-color: #1e293b;
      color: #93c5fd;
    }
    .job-meta { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    .job-address { font-size: 13px; color: #e2e8f0; line-height: 1.4; margin-bottom: 10px; }

    .btn-map {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 10px;
      border-radius: 10px;
      text-align: center;
      display: block;
      margin-bottom: 8px;
    }

    .action-stack { display: flex; flex-direction: column; gap: 7px; }
    .btn-action {
      width: 100%;
      border: none;
      font-size: 13px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-done { background-color: #10b981; color: #052e16; font-weight: 800; }
    .btn-abone-yok {
      background-color: #451a03;
      border: 1px solid #b45309;
      color: #fde68a;
      font-weight: 700;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      z-index: 120;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 360px;
      background-color: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
    }
    .modal-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; color: #f8fafc; }
    .modal-sub { font-size: 12px; color: #94a3b8; margin-bottom: 12px; line-height: 1.4; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .btn-cancel {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-confirm {
      background-color: #f59e0b;
      border: none;
      color: #0f172a;
      font-size: 13px;
      font-weight: 800;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      background-color: #111827;
      border: 1px dashed #334155;
      border-radius: 14px;
      color: #94a3b8;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #065f46;
      border: 1px solid #10b981;
      color: #ecfdf5;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 140;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="badge-tredas">TREDAŞ</div>
      <div class="header-title">Edirne Sayaç<br>Saha Rehberi</div>
    </div>
    <div class="header-right">
      <div class="counter-pill">İşlenen: <span id="doneCount">0</span> / <span id="totalCount">0</span></div>
      <button class="btn-menu" id="menuBtn" type="button" aria-label="Yetkili Menüsü" onclick="openMenuOrAdmin()">⋮</button>
    </div>
  </div>

  <div class="container">
    <div class="admin-drawer" id="adminDrawer">
      <div class="admin-header-row">
        <span class="admin-badge">🔐 YETKİLİ PANELİ (Yönetim)</span>
        <button class="btn-logout" type="button" onclick="logoutAdmin()">Çıkış Yap</button>
      </div>

      <div class="upload-grid">
        <div class="upload-box">
          <label class="upload-title" for="pdfFileInput">📄 PDF Seç<br>(Otomatik Tarar)</label>
          <input
            type="file"
            id="pdfFileInput"
            class="file-input"
            accept=".pdf,application/pdf"
            onchange="handlePdfFileSelect(event)"
          />
        </div>
        <div class="upload-box excel-box">
          <label class="upload-title" for="excelFileInput">📊 Excel Seç<br>(.xlsx / .xls / .csv)</label>
          <input
            type="file"
            id="excelFileInput"
            class="file-input"
            accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"
            onchange="handleExcelFileSelect(event)"
          />
        </div>
      </div>

      <div class="manual-box">
        <div class="manual-title">➕ Yeni İş Emri Ekle</div>
        <div class="manual-grid">
          <input type="text" id="manTesisat" class="mini-input" placeholder="Tesisat No" />
          <input type="text" id="manSeri" class="mini-input" placeholder="Seri No (Örn: LUN-123)" />
          <input type="text" id="manIlce" class="mini-input" placeholder="İlçe (Örn: SÜLOĞLU)" />
          <input type="text" id="manMahalle" class="mini-input" placeholder="Mahalle / Köy" />
        </div>
        <input type="text" id="manAdres" class="mini-input" placeholder="Açık Adres (Sokak, No, Köy/Mahalle)" />
        <select id="manTip" class="mini-input">
          <option value="Monofaze">Monofaze</option>
          <option value="Trifaze">Trifaze</option>
        </select>
        <button class="btn-add-manual" type="button" onclick="addManualJob()">✓ Kaydı Listeye Ekle</button>
      </div>

      <button class="btn-reset-all" type="button" onclick="wipeAllJobsAdmin()">🗑️ Tüm Listeyi Sıfırla (Yönetici)</button>

      <div class="scan-status" id="scanStatus"></div>
    </div>

    <div class="card">
      <div class="region-tabs">
        <button class="region-btn active" data-region="ALL" onclick="setRegion('ALL', this)">Tümü</button>
        <button class="region-btn" data-region="MERKEZ" onclick="setRegion('MERKEZ', this)">📍 Merkez<br>Mahalleler</button>
        <button class="region-btn" data-region="KOY" onclick="setRegion('KOY', this)">🌾 Köyler /<br>Beldeler</button>
      </div>

      <select id="ilceSelect" class="select-box" onchange="onIlceChange()">
        <option value="ALL">Tüm İlçeler</option>
      </select>

      <select id="mahalleSelect" class="select-box" onchange="renderList()">
        <option value="ALL">Tüm Mahalle / Köyler</option>
      </select>

      <input type="text" id="searchInput" class="search-box" placeholder="Tesisat No, Seri No, Mahalle veya Sokak ara..." oninput="renderList()" />

      <div class="chip-row">
        <button class="chip-btn active" data-phase="ALL" onclick="setPhase('ALL', this)">Tüm Sayaçlar</button>
        <button class="chip-btn" data-phase="Monofaze" onclick="setPhase('Monofaze', this)">Monofaze</button>
        <button class="chip-btn" data-phase="Trifaze" onclick="setPhase('Trifaze', this)">Trifaze</button>
      </div>
    </div>

    <div class="card">
      <div class="progress-top">
        <span id="progressLabel">Ekranda Kalan İş: 0</span>
        <span class="progress-pct" id="progressPct">%0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="job-list" id="jobList"></div>
  </div>

  <div class="modal-backdrop" id="pinModal">
    <div class="modal-card">
      <div class="modal-title">🔐 Yetkili Girişi</div>
      <div class="modal-sub">PDF/Excel yükleme, kayıt ekleme veya listeyi sıfırlama işlemleri için yetkili şifresini girin.</div>
      <input
        type="password"
        id="pinInput"
        class="select-box"
        inputmode="numeric"
        placeholder="Yetkili PIN Kodu"
        onkeydown="if(event.key==='Enter') verifyAdminPin()"
      />
      <div class="modal-actions">
        <button class="btn-cancel" type="button" onclick="closePinModal()">İptal</button>
        <button class="btn-confirm" type="button" onclick="verifyAdminPin()">Giriş Yap</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">✓ Kaydedildi</div>

  <script>
    if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    const ADMIN_PIN = "1923";
    const STORAGE_PROCESSED = "tredas_edirne_v7_islenen";
    const STORAGE_JOBS = "tredas_edirne_v7_isler";
    const STORAGE_ADMIN_AUTH = "tredas_edirne_v7_admin";
    const DB_NAME = "TredasEdirneSahaDB_v7";
    const STORE_PROCESSED = "processedJobs";
    const STORE_JOBS = "jobs";
    const CACHE_NAME = "tredas-edirne-vault-v7";
    const CACHE_KEY = "/__tredas_edirne_state_v7.json";

    let processedMap = {};
    let jobsList = [];
    let currentRegion = "ALL";
    let currentPhase = "ALL";
    let isAdminLoggedIn = false;
    let lastSavedAt = 0;

    const LOCATION_ALIASES = {
      "KEMALKOY": "KEMERKÖY",
      "KEMERKOY": "KEMERKÖY",
      "KEMER KOYU": "KEMERKÖY",
      "KEMAL KOYU": "KEMERKÖY",
      "1 MURAT": "1.MURAT",
      "BIRINCI MURAT": "1.MURAT",
      "SUKRUPASA": "ŞÜKRÜPAŞA"
    };

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }

    function trUpper(str) {
      return String(str || "").toLocaleUpperCase("tr").trim();
    }

    function stripDiacritics(str) {
      return trUpper(str)
        .replace(/İ/g, "I")
        .replace(/Ğ/g, "G")
        .replace(/Ü/g, "U")
        .replace(/Ş/g, "S")
        .replace(/Ö/g, "O")
        .replace(/Ç/g, "C");
    }

    function normalizeKey(str) {
      return stripDiacritics(str)
        .replace(/[^A-Z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function levenshteinDistance(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
      for (let j = 1; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + cost
          );
        }
      }
      return dp[a.length][b.length];
    }

    function unifyLocationName(rawName, existingNames = []) {
      const cleaned = trUpper(rawName)
        .replace(/\bKÖYÜN\s+KENDİSİ\b/gi, " ")
        .replace(/\bKOYUN\s+KENDISI\b/gi, " ")
        .replace(/\b(KÖYÜ|KÖY|KOYU|KOY|BELDESİ|BELDE|MAH\.?|MAHALLESİ)\b/gi, " ")
        .replace(/^[,;:\-|/.\s]+|[,;:\-|/.\s]+$/g, "")
        .replace(/\s+/g, " ")
        .trim();

      if (!cleaned || cleaned.length < 2) return "GENEL";

      const norm = normalizeKey(cleaned);
      if (LOCATION_ALIASES[norm]) return LOCATION_ALIASES[norm];

      const compact = norm.replace(/\s+/g, "");
      if (LOCATION_ALIASES[compact]) return LOCATION_ALIASES[compact];

      for (const candidate of existingNames) {
        const candNorm = normalizeKey(candidate);
        if (candNorm === norm) return candidate;
        const candCompact = candNorm.replace(/\s+/g, "");
        if (candCompact === compact) return candidate;
        if (Math.min(compact.length, candCompact.length) >= 5) {
          if (levenshteinDistance(compact, candCompact) <= 2) return candidate;
        }
      }
      return cleaned;
    }

    function syncAdminUi() {
      const drawer = document.getElementById("adminDrawer");
      const btn = document.getElementById("menuBtn");
      if (isAdminLoggedIn) {
        drawer.classList.add("open");
        btn.classList.add("admin-active");
        btn.textContent = "✓";
      } else {
        drawer.classList.remove("open");
        btn.classList.remove("admin-active");
        btn.textContent = "⋮";
      }
    }

    function openMenuOrAdmin() {
      if (isAdminLoggedIn) {
        document.getElementById("adminDrawer").classList.toggle("open");
        return;
      }
      document.getElementById("pinInput").value = "";
      document.getElementById("pinModal").classList.add("open");
      setTimeout(() => document.getElementById("pinInput").focus(), 50);
    }

    function closePinModal() {
      document.getElementById("pinModal").classList.remove("open");
    }

    function verifyAdminPin() {
      const entered = document.getElementById("pinInput").value.trim();
      if (entered === ADMIN_PIN) {
        isAdminLoggedIn = true;
        try { sessionStorage.setItem(STORAGE_ADMIN_AUTH, "1"); } catch (e) {}
        closePinModal();
        syncAdminUi();
        showToast("🔐 Yetkili girişi başarılı");
      } else {
        showToast("❌ Hatalı yetkili şifresi");
      }
    }

    function logoutAdmin() {
      isAdminLoggedIn = false;
      try { sessionStorage.removeItem(STORAGE_ADMIN_AUTH); } catch (e) {}
      syncAdminUi();
      showToast("Yetkili oturumu kapatıldı");
    }

    function wipeAllJobsAdmin() {
      if (!isAdminLoggedIn) {
        openMenuOrAdmin();
        return;
      }
      if (!confirm("Tüm iş emirleri ve işlenen kayıtlar kalıcı olarak sıfırlansın mı?")) return;
      jobsList = [];
      processedMap = {};
      lastSavedAt = Date.now();
      try {
        localStorage.removeItem(STORAGE_JOBS);
        localStorage.removeItem(STORAGE_PROCESSED);
        localStorage.removeItem(STORAGE_JOBS + "_ts");
      } catch (e) {}
      try {
        window.name = JSON.stringify({ __tredas_v7: true, ts: lastSavedAt, jobsList: [], processedMap: {} });
      } catch (e) {}
      writeCacheVault({ ts: lastSavedAt, jobsList: [], processedMap: {} });
      if (window.indexedDB) {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onsuccess = (e) => {
            const db = e.target.result;
            const tx = db.transaction([STORE_JOBS, STORE_PROCESSED], "readwrite");
            tx.objectStore(STORE_JOBS).clear();
            tx.objectStore(STORE_PROCESSED).clear();
          };
        } catch (e) {}
      }
      populateIlceDropdown();
      populateMahalleDropdown();
      renderList();
      document.getElementById("scanStatus").textContent = "🗑️ Liste sıfırlandı.";
      showToast("🗑️ Tüm kayıtlar sıfırlandı");
    }

    function mergeStateIntoMemory(incomingJobs, incomingProcessed, incomingTs = 0) {
      let changed = false;
      if (Array.isArray(incomingJobs) && incomingJobs.length > 0) {
        const existingMap = new Map(jobsList.map(j => [j.id, j]));
        for (const job of incomingJobs) {
          if (!job || !job.id) continue;
          if (!existingMap.has(job.id)) {
            jobsList.push(job);
            existingMap.set(job.id, job);
            changed = true;
          }
        }
      }
      if (incomingProcessed && typeof incomingProcessed === "object") {
        for (const [id, info] of Object.entries(incomingProcessed)) {
          if (!info) continue;
          const cur = processedMap[id];
          const nextTs = Number(info.ts || incomingTs || 0);
          const curTs = Number((cur && cur.ts) || 0);
          if (!cur || nextTs >= curTs) {
            processedMap[id] = { durum: info.durum, ts: nextTs };
            changed = true;
          }
        }
      }
      if (incomingTs > lastSavedAt) lastSavedAt = incomingTs;
      return changed;
    }

    async function writeCacheVault(snapshot) {
      if (!("caches" in window)) return;
      try {
        const cache = await caches.open(CACHE_NAME);
        await cache.put(CACHE_KEY, new Response(JSON.stringify(snapshot), {
          headers: { "Content-Type": "application/json" }
        }));
      } catch (e) {}
    }

    async function readCacheVault() {
      if (!("caches" in window)) return null;
      try {
        const cache = await caches.open(CACHE_NAME);
        const match = await cache.match(CACHE_KEY);
        if (!match) return null;
        return await match.json();
      } catch (e) {
        return null;
      }
    }

    function saveAllData() {
      const now = Date.now();
      if (now > lastSavedAt) lastSavedAt = now;
      const snapshot = { ts: lastSavedAt, jobsList, processedMap };

      try {
        localStorage.setItem(STORAGE_PROCESSED, JSON.stringify(processedMap));
        localStorage.setItem(STORAGE_JOBS, JSON.stringify(jobsList));
        localStorage.setItem(STORAGE_JOBS + "_ts", String(lastSavedAt));
      } catch (e) {}

      try {
        window.name = JSON.stringify({ __tredas_v7: true, ...snapshot });
      } catch (e) {}

      writeCacheVault(snapshot);

      if (window.indexedDB) {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_PROCESSED)) {
              db.createObjectStore(STORE_PROCESSED, { keyPath: "id" });
            }
            if (!db.objectStoreNames.contains(STORE_JOBS)) {
              db.createObjectStore(STORE_JOBS, { keyPath: "id" });
            }
          };
          req.onsuccess = (e) => {
            const db = e.target.result;
            const tx1 = db.transaction(STORE_PROCESSED, "readwrite");
            const s1 = tx1.objectStore(STORE_PROCESSED);
            s1.clear();
            Object.entries(processedMap).forEach(([id, info]) => s1.put({ id, ...info }));

            const tx2 = db.transaction(STORE_JOBS, "readwrite");
            const s2 = tx2.objectStore(STORE_JOBS);
            s2.clear();
            jobsList.forEach(j => s2.put(j));
          };
        } catch (e) {}
      }
    }

    async function loadAllData() {
      try {
        if (sessionStorage.getItem(STORAGE_ADMIN_AUTH) === "1") {
          isAdminLoggedIn = true;
          syncAdminUi();
        }
      } catch (e) {}

      let anyChanged = false;
      try {
        const pRaw = localStorage.getItem(STORAGE_PROCESSED);
        const jRaw = localStorage.getItem(STORAGE_JOBS);
        const tRaw = Number(localStorage.getItem(STORAGE_JOBS + "_ts") || "0");
        if (mergeStateIntoMemory(jRaw ? JSON.parse(jRaw) : [], pRaw ? JSON.parse(pRaw) : {}, tRaw)) {
          anyChanged = true;
        }
      } catch (e) {}

      if (window.name) {
        try {
          const nameObj = JSON.parse(window.name);
          if (nameObj && nameObj.__tredas_v7) {
            if (mergeStateIntoMemory(nameObj.jobsList, nameObj.processedMap, Number(nameObj.ts || 0))) {
              anyChanged = true;
            }
          }
        } catch (e) {}
      }

      const cachedSnap = await readCacheVault();
      if (cachedSnap && mergeStateIntoMemory(cachedSnap.jobsList, cachedSnap.processedMap, Number(cachedSnap.ts || 0))) {
        anyChanged = true;
      }

      if (window.indexedDB) {
        try {
          const db = await new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
              const d = e.target.result;
              if (!d.objectStoreNames.contains(STORE_PROCESSED)) {
                d.createObjectStore(STORE_PROCESSED, { keyPath: "id" });
              }
              if (!d.objectStoreNames.contains(STORE_JOBS)) {
                d.createObjectStore(STORE_JOBS, { keyPath: "id" });
              }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = reject;
          });

          const [idbProc, idbJobs] = await new Promise((resolve, reject) => {
            const tx = db.transaction([STORE_PROCESSED, STORE_JOBS], "readonly");
            const r1 = tx.objectStore(STORE_PROCESSED).getAll();
            const r2 = tx.objectStore(STORE_JOBS).getAll();
            tx.oncomplete = () => resolve([r1.result || [], r2.result || []]);
            tx.onerror = reject;
          });

          const procDict = {};
          idbProc.forEach(item => {
            if (item && item.id) procDict[item.id] = { durum: item.durum, ts: item.ts || 0 };
          });
          if (mergeStateIntoMemory(idbJobs, procDict, lastSavedAt)) anyChanged = true;
        } catch (e) {}
      }

      if (jobsList.length > 0 || anyChanged) {
        jobsList.forEach(j => {
          j.bolge = detectBolge(j.adres + " " + j.mahalle + " " + j.ilce, j.mahalle);
        });
        saveAllData();
        populateIlceDropdown();
        populateMahalleDropdown();
        renderList();
      }
    }

    function detectIlce(text) {
      const norm = normalizeKey(text);
      const map = [
        ["EDIRNE MERKEZ", "EDİRNE MERKEZ"],
        ["KESAN", "KEŞAN"],
        ["UZUNKOPRU", "UZUNKÖPRÜ"],
        ["IPSALA", "İPSALA"],
        ["HAVSA", "HAVSA"],
        ["ENEZ", "ENEZ"],
        ["LALAPASA", "LALAPAŞA"],
        ["MERIC", "MERİÇ"],
        ["SULOGLU", "SÜLOĞLU"]
      ];
      for (const [k, label] of map) {
        if (norm.includes(k)) return label;
      }
      return "EDİRNE MERKEZ";
    }

    function detectBolge(text, mahalleName) {
      const norm = normalizeKey((text || "") + " " + (mahalleName || ""));
      if (/\bKOYU?\b|\bKOY\b|\bKOYUN\s+KENDISI\b|\bBELDESI?\b|\bBELDE\b|\bBUCAK\b|\bMEVKII\b|\bYAYLA\b/.test(norm)) {
        return "KOY";
      }
      return "MERKEZ";
    }

    function detectMahalle(text, existingNames) {
      const upper = trUpper(text);

      const koyKendisiMatch = upper.match(/([A-ZÇĞİÖŞÜ0-9.\-]{2,25}(?:\s+[A-ZÇĞİÖŞÜ0-9.\-]{2,20})?)\s+(?:KÖYÜN\s+KENDİSİ|KOYUN\s+KENDISI)/);
      if (koyKendisiMatch && koyKendisiMatch[1]) {
        const raw = koyKendisiMatch[1].replace(/^(?:MERKEZ|EDİRNE|KEŞAN|UZUNKÖPRÜ|İPSALA|HAVSA|ENEZ|LALAPAŞA|MERİÇ|SÜLOĞLU|\s|[,;:\-|/])+/, "");
        return unifyLocationName(raw || koyKendisiMatch[1], existingNames);
      }

      const koyMatch = upper.match(/([A-ZÇĞİÖŞÜ0-9.\-]{2,25}(?:\s+[A-ZÇĞİÖŞÜ0-9.\-]{2,20})?)\s*(?:\bKÖYÜ\b|\bKÖY\b|\bBELDESİ\b|\bBELDE\b)/);
      if (koyMatch && koyMatch[1]) {
        const raw = koyMatch[1].replace(/^(?:MERKEZ|EDİRNE|KEŞAN|UZUNKÖPRÜ|İPSALA|HAVSA|ENEZ|LALAPAŞA|MERİÇ|SÜLOĞLU|\s|[,;:\-|/])+/, "");
        return unifyLocationName(raw || koyMatch[1], existingNames);
      }

      const mahMatch = upper.match(/([A-ZÇĞİÖŞÜ0-9.\-]{1,20}(?:\s+[A-ZÇĞİÖŞÜ0-9.\-]{1,20})?)\s*(?:\bMAH\.?\b|\bMAHALLESİ\b)/);
      if (mahMatch && mahMatch[1]) {
        const raw = mahMatch[1].replace(/^(?:MERKEZ|EDİRNE|KEŞAN|UZUNKÖPRÜ|İPSALA|HAVSA|ENEZ|LALAPAŞA|MERİÇ|SÜLOĞLU|\s|[,;:\-|/])+/, "");
        return unifyLocationName(raw || mahMatch[1], existingNames);
      }

      const aliasKeys = Object.keys(LOCATION_ALIASES);
      const normUpper = normalizeKey(upper);
      for (const ak of aliasKeys) {
        if (normUpper.includes(ak)) {
          return unifyLocationName(LOCATION_ALIASES[ak], existingNames);
        }
      }
      return "GENEL";
    }

    function detectTip(text) {
      return /trifaze|3\s*faz|üç\s*faz|uc\s*faz/i.test(stripDiacritics(text)) ? "Trifaze" : "Monofaze";
    }

    function cleanAddressText(rawChunk, tesisat, seri) {
      let addr = rawChunk.replace(/\s*\|\s*/g, " ").replace(/\s+/g, " ").trim();
      if (tesisat) addr = addr.replace(new RegExp("\\b" + tesisat + "\\b", "g"), " ");
      if (seri && seri !== "BİLİNMİYOR") {
        const escSeri = seri.replace(/[-/\\^$*+?.()|[\]{}]/g, "\\$&").replace(/-/g, "[-_ ]?");
        addr = addr.replace(new RegExp("\\b" + escSeri + "\\b", "gi"), " ");
      }
      addr = addr
        .replace(/\b(monofaze|trifaze|3\s*faz|üç\s*faz)\b/gi, " ")
        .replace(/\s+([,.;:/])/g, "$1")
        .replace(/([,.;:/])\s*([,.;:/])+/g, "$1")
        .replace(/^\s*[,;:\-|/]+\s*|\s*[,;:\-|/]+\s*$/g, "")
        .replace(/\s+/g, " ")
        .trim();
      return addr || rawChunk.replace(/\s+/g, " ").trim();
    }

    function buildGoogleMapsQuery(item) {
      let q = String(item.adres || "")
        .replace(/^\s*\d+\s*(?:sayaç|sayac|adet|no\.?|kayıt)\b[:\-\s]*/i, "")
        .replace(/\b(?:iç\s*kapı(?:\s*no)?|daire(?:\s*no)?|kat|blok(?:\s*no)?|asansör|bodrum|zemin)\s*[:.#-]?\s*[a-z0-9çğıöşü_-]+/gi, " ")
        .replace(/\b(koyun\s*kendisi|köyün\s*kendisi)\b/gi, " ")
        .replace(/\s+/g, " ")
        .trim();

      const normQ = normalizeKey(q);
      const normMah = item.mahalle && item.mahalle !== "GENEL" ? normalizeKey(item.mahalle) : "";
      const normIlce = item.ilce ? normalizeKey(item.ilce) : "";

      const parts = [];
      if (q) parts.push(q);
      if (normMah && !normQ.includes(normMah)) {
        parts.push(item.bolge === "KOY" ? (item.mahalle + " Köyü") : (item.mahalle + " Mah."));
      }
      if (normIlce && !normQ.includes(normIlce)) {
        parts.push(item.ilce);
      }
      if (!normQ.includes("EDIRNE")) {
        parts.push("Edirne");
      }
      parts.push("Türkiye");

      return parts.join(", ").replace(/\s*,\s*,+/g, ", ").trim();
    }

    function parseSingleChunk(chunk, sourcePrefix, existingNames) {
      const cleaned = chunk.replace(/\s+/g, " ").trim();
      if (!cleaned) return null;

      const tesisatMatch = cleaned.match(/\b(\d{6,16})\b/);
      if (!tesisatMatch) return null;
      const tesisat = tesisatMatch[1];

      const seriMatch = cleaned.match(/\b([A-ZÇĞİÖŞÜ]{2,6}[-_ ]?\d{4,12})\b/i);
      const seri = seriMatch ? seriMatch[1].toLocaleUpperCase("tr").replace(/\s+/g, "-") : "BİLİNMİYOR";

      const mahalle = detectMahalle(cleaned, existingNames);
      const ilce = detectIlce(cleaned);
      const bolge = detectBolge(cleaned, mahalle);
      const tip = detectTip(cleaned);
      const adres = cleanAddressText(cleaned, tesisat, seri);

      return {
        id: sourcePrefix + "-" + tesisat + "-" + seri,
        ilce,
        bolge,
        mahalle,
        tesisat,
        tip,
        seri,
        adres
      };
    }

    function addManualJob() {
      if (!isAdminLoggedIn) {
        openMenuOrAdmin();

      }
      const tesisat = document.getElementById("manTesisat").value.trim();
      const seri = trUpper(document.getElementById("manSeri").value) || "BİLİNMİYOR";

      const existingNames = [...new Set(jobsList.map(j => j.mahalle))];
      const mahalle = rawMah ? unifyLocationName(rawMah, existingNames) : detectMahalle(adres, existingNames);
      const bolge = detectBolge(adres + " " + rawMah, mahalle);

      const newItem = {
        id: "MAN-" + tesisat + "-" + Date.now().toString(36),
        ilce,
        bolge,
        mahalle,
        tesisat,

        adres
      };

      jobsList.unshift(newItem);

      document.getElementById("manMahalle").value = "";

      document.getElementById("scanStatus").textContent = "✅ Yeni kayıt eklendi (Toplam: " + jobsList.length + ").";
      showToast("✓ Kayıt eklendi");
    }

    function addParsedChunks(chunks, sourcePrefix) {
      const existingNames = [...new Set(jobsList.map(j => j.mahalle))];
      const existingKeys = new Set(jobsList.map(j => j.tesisat + "|" + j.seri));
      let addedCount = 0;

      for (const chunk of chunks) {
        const parsed = parseSingleChunk(chunk, sourcePrefix, existingNames);
        if (!parsed) continue;
        if (!existingNames.includes(parsed.mahalle)) existingNames.push(parsed.mahalle);
        const dedupKey = parsed.tesisat + "|" + parsed.seri;
        if (existingKeys.has(dedupKey)) continue;
        existingKeys.add(dedupKey);
        jobsList.push(parsed);
        addedCount++;
      }

      saveAllData();
      populateIlceDropdown();
      populateMahalleDropdown();
      renderList();
      return addedCount;
    }

    async function extractTextFromPdfFile(file) {
      if (!window.pdfjsLib) throw new Error("PDF okuyucu yüklenemedi.");
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      let fullText = "";

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const content = await page.getTextContent();
        let lastY = null;
        let lineText = "";

        const sortedItems = [...content.items].filter(it => "str" in it && it.str.trim() !== "");
        for (const item of sortedItems) {
          const y = item.transform ? Math.round(item.transform[5]) : null;
          if (lastY !== null && y !== null && Math.abs(y - lastY) > 4) {
            fullText += lineText.trim() + "\n";
            lineText = "";
          }
          lineText += item.str + " ";
          lastY = y;
        }
        if (lineText.trim()) fullText += lineText.trim() + "\n";
      }
      return fullText;
    }

    async function handlePdfFileSelect(event) {
      if (!isAdminLoggedIn) {
        event.target.value = "";
        openMenuOrAdmin();
        return;
      }
      const file = event.target.files && event.target.files[0];
      const statusEl = document.getElementById("scanStatus");
      if (!file) return;

      statusEl.textContent = "⏳ PDF taranıyor...";
      try {
        const rawText = await extractTextFromPdfFile(file);
        const lines = rawText.split(/\r?\n/);
        const chunks = [];
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          const multiMatches = trimmed.match(/\b\d{6,16}\b/g);
          if (multiMatches && multiMatches.length > 1) {
            trimmed.split(/(?=\b\d{6,16}\b)/).forEach(p => { if (p.trim()) chunks.push(p.trim()); });
          } else {
            chunks.push(trimmed);
          }
        }
        const addedCount = addParsedChunks(chunks, "PDF");
        statusEl.textContent = addedCount > 0
          ? "✅ PDF'den " + addedCount + " kayıt eklendi (Toplam: " + jobsList.length + ")."
          : "⚠️ PDF tarandı; eklenecek yeni kayıt bulunamadı.";
        showToast(addedCount > 0 ? "✓ " + addedCount + " kayıt eklendi" : "Yeni kayıt bulunamadı");
      } catch (err) {
        statusEl.textContent = "❌ PDF okunamadı.";
      } finally {
        event.target.value = "";
      }
    }

    async function handleExcelFileSelect(event) {
      if (!isAdminLoggedIn) {
        event.target.value = "";
        openMenuOrAdmin();
        return;
      }
      const file = event.target.files && event.target.files[0];
      const statusEl = document.getElementById("scanStatus");
      if (!file) return;

      statusEl.textContent = "⏳ Excel dosyası taranıyor...";
      try {
        if (!window.XLSX) throw new Error("Excel okuyucu yüklenemedi.");
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: "array" });
        const chunks = [];
        workbook.SheetNames.forEach(sheetName => {
          const sheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: "" });
          rows.forEach(row => {
            if (!Array.isArray(row)) return;
            const joined = row.map(cell => String(cell || "").trim()).filter(Boolean).join(" | ");
            if (joined) chunks.push(joined);
          });
        });
        const addedCount = addParsedChunks(chunks, "XLS");
        statusEl.textContent = addedCount > 0
          ? "✅ Excel'den " + addedCount + " kayıt eklendi (Toplam: " + jobsList.length + ")."
          : "⚠️ Excel tarandı; eklenecek yeni kayıt bulunamadı.";
        showToast(addedCount > 0 ? "✓ " + addedCount + " kayıt eklendi" : "Yeni kayıt bulunamadı");
      } catch (err) {
        statusEl.textContent = "❌ Excel dosyası okunamadı.";
      } finally {
        event.target.value = "";
      }
    }

    function populateIlceDropdown() {

      ilceler.forEach(il => {
        const opt = document.createElement("option");
        opt.value = il;
        opt.textContent = il;

    function populateMahalleDropdown() {
      const sel = document.getElementById("mahalleSelect");
      const prev = sel.value;
      const selectedIlce = document.getElementById("ilceSelect").value;
      const filtered = jobsList.filter(j => {
        if (selectedIlce !== "ALL" && j.ilce !== selectedIlce) return false;
        if (currentRegion !== "ALL" && j.bolge !== currentRegion) return false;
        return true;
      });
      const mahalleler = [...new Set(filtered.map(j => j.mahalle))].sort((a, b) => a.localeCompare(b, "tr"));
      const defaultLabel = currentRegion === "KOY"
        ? "Tüm Köyler / Beldeler"
        : currentRegion === "MERKEZ"
          ? "Tüm Merkez Mahalleler"
          : "Tüm Mahalle / Köyler";
      sel.innerHTML = `<option value="ALL">${defaultLabel}</option>`;
      mahalleler.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = currentRegion === "KOY" ? (m + " Köyü") : m;
        sel.appendChild(opt);
      });
      if (mahalleler.includes(prev)) sel.value = prev;
      else sel.value = "ALL";
    }

    function renderList() {
      const selectedIlce = document.getElementById("ilceSelect").value;
      const selectedMahalle = document.getElementById("mahalleSelect").value;
      const query = document.getElementById("searchInput").value.trim().toLocaleLowerCase("tr");

      const total = jobsList.length;
      const done = jobsList.filter(j => Boolean(processedMap[j.id])).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById("doneCount").textContent = done;
      document.getElementById("totalCount").textContent = total;
      document.getElementById("progressPct").textContent = "%" + pct;
      document.getElementById("progressFill").style.width = pct + "%";

      const visible = jobsList.filter(item => {
        if (processedMap[item.id]) return false;
        if (selectedIlce !== "ALL" && item.ilce !== selectedIlce) return false;
        if (currentRegion !== "ALL" && item.bolge !== currentRegion) return false;
        if (selectedMahalle !== "ALL" && item.mahalle !== selectedMahalle) return false;
        if (currentPhase !== "ALL" && item.tip !== currentPhase) return false;
        if (query) {
          const hay = (item.tesisat + " " + item.seri + " " + item.ilce + " " + item.mahalle + " " + item.adres).toLocaleLowerCase("tr");
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      document.getElementById("progressLabel").textContent = "Ekranda Kalan İş: " + visible.length;

      const listEl = document.getElementById("jobList");
      if (visible.length === 0) {
        listEl.innerHTML = '<div class="empty-state">📂 Kayıt bulunamadı veya bu filtrede bekleyen iş kalmadı. Yetkili girişi (⋮) ile PDF/Excel yükleyebilirsin.</div>';
        return;
      }

      listEl.innerHTML = visible.map(item => {
        const mapQuery = buildGoogleMapsQuery(item);
        const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(mapQuery);
        const yerEtiketi = item.bolge === "KOY" ? (item.mahalle + " KÖYÜ") : item.mahalle;
        return `
          <div class="job-card">
            <div class="job-top">
              <span class="job-id">Tesisat: ${item.tesisat}</span>
              <span class="job-type">${item.tip}</span>
            </div>
            <div class="job-meta">Seri No: <strong>${item.seri}</strong> • ${item.ilce} / ${yerEtiketi}</div>
            <div class="job-address">📍 ${item.adres}</div>
            <a class="btn-map" href="${mapsUrl}" target="_blank" rel="noopener">🗺️ Haritada Göster</a>
            <div class="action-stack">
              <button class="btn-action btn-done" onclick="markJobStatus('${item.id}', 'Tamamlandı')">✓ İşi Tamamla</button>
              <button class="btn-action btn-abone-yok" onclick="markJobStatus('${item.id}', 'Abone Yok / Kapalı')">🚪 Abone Yok / Kapalı</button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.addEventListener("pagehide", saveAllData);
    window.addEventListener("beforeunload", saveAllData);
    window.addEventListener("focus", () => { loadAllData(); });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") saveAllData();
      else if (document.visibilityState === "visible") loadAllData();
    });

    (async function boot() {
      syncAdminUi();
      populateIlceDropdown();
      populateMahalleDropdown();
      renderList();
      await loadAllData();
    })();
  </script>
</body>
</html>
