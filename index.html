<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TREDAŞ - Edirne & Kırklareli Saha Paneli</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b1120;--card:#111827;--soft:#1e293b;--input:#0f172a;--border:#334155;--txt:#f8fafc;--muted:#94a3b8;--accent:#f59e0b;--blue:#2563eb;--green:#10b981;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:13.5px;line-height:1.4}
.container{max-width:960px;margin:0 auto;padding:10px 10px 72px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:10px;position:sticky;top:6px;z-index:900}
.badge{background:var(--accent);color:#090d16;font-weight:900;font-size:11px;padding:4px 7px;border-radius:6px}
.app-title{font-size:13.5px;font-weight:800;margin:0}
.sync{font-size:11px;font-weight:700}
.sync-ok{color:#34d399}.sync-err{color:#f87171}.sync-busy{color:#fbbf24}
.pill{background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:800;white-space:nowrap}
.menu-btn{background:var(--soft);color:#fff;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;font-size:17px;cursor:pointer}
.mod-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mod-btn{background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:800;cursor:pointer}
.mod-btn.active{background:rgba(245,158,11,.16);color:#fde68a;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.cat-btn{background:var(--input);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:7px 6px;font-size:12px;font-weight:700;cursor:pointer}
.cat-btn.active{background:rgba(37,99,235,.25);color:#fff;border-color:#3b82f6}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media(max-width:560px){.filter-grid{grid-template-columns:1fr}}
select,input[type=text],input[type=password],textarea{width:100%;background:var(--input);color:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;outline:none;font-family:inherit}
textarea{resize:vertical;min-height:62px}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.chip{background:var(--input);color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
.chip.active{background:rgba(37,99,235,.28);color:#fff;border-color:#3b82f6}
.progress-head{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:5px}
.progress{width:100%;height:6px;background:var(--input);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#2563eb,#10b981);width:0%;transition:width .25s}
.job{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.job.err{border-color:rgba(239,68,68,.5)} .job.done{border-color:rgba(16,185,129,.5)}
.job-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.job-title{font-size:13.5px;font-weight:800;color:#fbbf24}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag-m{background:rgba(37,99,235,.25);color:#bfdbfe}.tag-k{background:rgba(16,185,129,.25);color:#a7f3d0}.tag-e{background:rgba(239,68,68,.22);color:#fecaca}.tag-d{background:rgba(16,185,129,.22);color:#a7f3d0}
.job-meta{font-size:11.5px;color:var(--muted);margin-bottom:7px}
.info{font-size:12.5px;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:8px;line-height:1.45}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
@media(max-width:520px){.actions{grid-template-columns:1fr}}
.btn{border:1px solid var(--border);border-radius:8px;padding:8px 9px;font-size:12px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}.btn-i{background:rgba(37,99,235,.22);border-color:#60a5fa;color:#dbeafe}.btn-s{background:var(--green);border-color:var(--green);color:#052e16}.btn-sec{background:var(--soft);color:#fff}.btn-w{background:var(--accent);border-color:var(--accent);color:#111827}.btn-d{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.55);color:#fecaca}
.admin{border:1px solid rgba(245,158,11,.55);background:rgba(245,158,11,.08);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin-top:8px}
.note{font-size:11.5px;color:var(--muted);margin-top:6px}
.reason-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.reason-btn{background:var(--input);color:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 8px;font-size:11.5px;font-weight:700;cursor:pointer;text-align:left}
.reason-btn.sel{background:rgba(16,185,129,.22);border-color:var(--green);color:#a7f3d0}
.label{display:block;font-size:11.5px;font-weight:700;color:#fbbf24;margin-bottom:3px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:14px;z-index:1200}
.backdrop.open{display:flex}
.modal{width:100%;max-width:430px;max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.empty{border:1px dashed var(--border);border-radius:12px;padding:18px 12px;text-align:center;color:var(--muted);font-size:12.5px}
.hidden{display:none!important}
.pill-wrap{display:flex;flex-wrap:wrap;gap:5px}
.d-pill{background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer}
.d-pill.active{background:rgba(16,185,129,.22);color:#fff;border-color:var(--green)}
</style>
</head>
<body>
<div class="container">
<header class="topbar">
<div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
<span class="badge">TREDAŞ</span>
<div><h1 class="app-title">Edirne & Kırklareli Saha</h1><div id="syncStatus" class="sync sync-busy">⏳ Sunucu bekleniyor...</div></div>
</div>
<div id="doneCounter" class="pill">0 / 0</div>
<button id="menuBtn" class="menu-btn">⋮</button>
</header>

<div class="mod-switch">
<button id="tabSahaBtn" class="mod-btn active">📋 Saha İş Listesi</button>
<button id="tabFaultBtn" class="mod-btn">⚠️ Hatalı Adres (<span id="faultBadge">0</span>) • ✓ (<span id="doneFaultBadge">0</span>)</button>
</div>

<div id="adminPanel" class="admin hidden">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong>🔐 YETKİLİ PANELİ</strong><button id="logoutBtn" class="btn btn-sec" style="padding:4px 9px;font-size:11.5px">Çıkış</button></div>
<div class="admin-grid">
<label class="btn btn-p" style="cursor:pointer">📊 Saha Excel Yükle<input type="file" id="excelInput" accept=".xlsx,.xls,.csv" hidden /></label>
<label class="btn btn-w" style="cursor:pointer">⚠️ Hatalı Excel Yükle<input type="file" id="faultExcelInput" accept=".xlsx,.xls,.csv" hidden /></label>
<button id="repairBtn" class="btn btn-sec">🤖 Birleştir & Düzenle</button>
<button id="showDoneBtn" class="btn btn-sec">✓ Tamamlananlar</button>
<button id="clearBtn" class="btn btn-d">🗑️ Tümünü Sil</button>
</div><div id="adminStatus" class="note"></div>
</div>

<div id="sahaModule">
<section class="card">
<div class="cat-grid">
<button class="cat-btn active" data-cat="ALL">Tümü</button>
<button class="cat-btn" data-cat="MAHALLE">🏙️ Mahalleler</button>
<button class="cat-btn" data-cat="KOY">🌾 Köyler</button>
</div>
<div class="filter-grid"><select id="districtSelect"><option value="ALL">Tüm İlçeler</option></select><select id="settlementSelect"><option value="ALL">Tüm Mahalle / Köyler</option></select></div>
<input id="searchInput" type="text" placeholder="Tesisat No, Seri No, Mahalle, Köy, Yol veya Adres ara..." />
<div class="controls"><div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="chip active" data-meter="ALL">Tümü</button><button class="chip" data-meter="MONO">Monofaze</button><button class="chip" data-meter="TRI">Trifaze</button></div>
<select id="sortSelect" style="width:auto;min-width:175px;padding:6px 9px;font-size:11.5px">
<option value="DEFAULT">Sırala: Varsayılan</option>
<option value="SETTLEMENT">Sırala: Mahalle / Köy (A-Z)</option>
<option value="TESISAT">Sırala: Tesisat No</option>
<option value="ROTA">Sırala: Rota (Akıllı - En Yakın)</option>
</select></div>
</section>
<section class="card"><div class="progress-head"><span id="filteredLabel">Ekranda Kalan: 0</span><span id="percentLabel">%0</span></div><div class="progress"><div id="progressFill" class="progress-fill"></div></div></section>
<div id="jobsContainer"></div>
<div id="loadMoreWrap" class="hidden" style="margin-top:8px"><button id="loadMoreBtn" class="btn btn-sec" style="width:100%">Daha Fazla Göster</button></div>
</div>

<div id="faultModule" class="hidden">
<div class="mod-switch">
<button id="faultActiveBtn" class="mod-btn active">⚠️ Bekleyen Hatalı (<span id="faultActiveCount">0</span>)</button>
<button id="faultDoneBtn" class="mod-btn">✓ Tamamlananlar (<span id="faultDoneCount">0</span>)</button>
</div>
<div id="faultActiveSection">
<section class="card"><div style="font-size:12px;font-weight:800;color:#fbbf24;margin-bottom:6px">👷 Personel / Ekip</div><div id="faultPersonPills" class="pill-wrap"></div></section>
<section class="card">
<div style="font-size:12px;font-weight:800;color:#fbbf24;margin-bottom:6px">⚠️ Hatalı Filtreler</div>
<div class="filter-grid"><select id="faultPersonSelect"><option value="ALL">Tüm Personeller</option></select><select id="faultGroupSelect"><option value="ALL">Tüm Gruplar / İlçeler</option></select></div>
<div class="filter-grid"><select id="faultReasonSelect"><option value="ALL">Tüm İş / Arıza Nedenleri</option></select><select id="faultTypeSelect"><option value="ALL">Tüm Adres Tipleri</option><option value="MISSING_SETTLEMENT">Mahalle / Köy Eksik</option><option value="IL_AS_DISTRICT">İl Alanında İlçe Yazılı</option><option value="DASH_OR_TRUNCATED">Eksik / Kesik / (- -) Adres</option><option value="METER_ERR">Modem / Sayaç Hatası</option></select></div>
<input id="faultSearchInput" type="text" placeholder="Tesisat, Personel, İş Nedeni, Adres veya Seri No ara..." />
</section>
<section class="card"><div class="progress-head"><span id="faultCountLabel">Listelenen: 0</span><span id="faultTotalLabel">Toplam: 0</span></div></section>
<div id="faultContainer"></div>
<div id="faultLoadMoreWrap" class="hidden" style="margin-top:8px"><button id="faultLoadMoreBtn" class="btn btn-sec" style="width:100%">Daha Fazla Göster</button></div>
</div>
<div id="faultDoneSection" class="hidden">
<section class="card"><div style="font-size:12px;font-weight:800;color:#fbbf24;margin-bottom:6px">✓ Tamamlanan Hatalı Kayıtlar (1 Ay Sonra Silinir)</div><input id="doneFaultSearch" type="text" placeholder="Tesisat, Yapan Kişi, İş veya Not ara..." /></section>
<div id="doneFaultContainer"></div>
</div>
</div>
</div>

<div id="faultModal" class="backdrop"><div class="modal">
<h3 style="margin-top:0">Tamamlandı - İş / Hata Notu</h3><p id="faultTargetInfo" style="font-size:11.5px;color:var(--muted)"></p>
<label class="label">Yapan Kişi / Ekip</label><input id="actorInput" list="personDatalist" type="text" placeholder="Personel / ekip adı..." style="margin-bottom:7px" /><datalist id="personDatalist"></datalist>
<label class="label">Ne Hata / İş Vardı?</label><input id="errorInput" type="text" placeholder="Örn: Modem IP ve Port Geçersiz..." style="margin-bottom:7px" />
<label class="label">Neden Yapıldı? (Hızlı Seçim)</label>
<div class="reason-grid">
<button type="button" class="reason-btn" data-reason="IP / Port Güncellendi">🌐 IP / Port Güncellendi</button>
<button type="button" class="reason-btn" data-reason="Kablo / Sayaç Bağlantısı Düzeltildi">🔌 Kablo / Sayaç Düzeltildi</button>
<button type="button" class="reason-btn" data-reason="Merkezi Okuma / İş Emri Kontrol Edildi">📋 Okuma / İş Emri Kontrol</button>
<button type="button" class="reason-btn" data-reason="Modem Enerji / Ping Sorunu Giderildi">⚡ Enerji / Ping Giderildi</button>
</div>
<label class="label">Açıklama Notu</label><textarea id="reasonInput" placeholder="Ne yapıldı, neden yapıldı..." style="margin-bottom:9px"></textarea>
<div style="display:flex;gap:8px"><button id="confirmFaultBtn" class="btn btn-s" style="flex:1">Kaydet ve Tamamla</button><button id="cancelFaultBtn" class="btn btn-sec" style="flex:1">İptal</button></div>
</div></div>

<div id="menuModal" class="backdrop"><div class="modal">
<h3 style="margin-top:0">Yetkili Girişi</h3><p style="font-size:12.5px;color:var(--muted)">Excel yükleme için PIN girin.</p>
<input id="pinInput" type="password" inputmode="numeric" placeholder="PIN (1923)" style="margin-bottom:10px" />
<div style="display:flex;gap:8px"><button id="pinBtn" class="btn btn-p" style="flex:1">Giriş</button><button id="pinCloseBtn" class="btn btn-sec" style="flex:1">Kapat</button></div>
<div id="pinError" style="color:var(--red);font-size:12px;margin-top:8px"></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBKtYaeuAiY1Pb8NspS2eiD8PA6aTksw24",
  authDomain: "edirne-sayac-saha.firebaseapp.com",
  databaseURL: "https://edirne-sayac-saha-default-rtdb.firebaseio.com",
  projectId: "edirne-sayac-saha",
  storageBucket: "edirne-sayac-saha.firebasestorage.app",
  messagingSenderId: "587813278589",
  appId: "1:587813278589:web:0b800320e74013555e3214",
  measurementId: "G-8NZ19TQY38"
};

const DB_PATH = "edirne_saha_v1";
const ADMIN_PIN = "1923";
const PAGE_SIZE = 40;
const RETENTION_MS = 30*24*60*60*1000;

const DISTRICTS = {
  "Edirne Merkez":{lat:41.6771,lon:26.5557,il:"Edirne",ilce:"Merkez"},
  "Keşan":{lat:40.8559,lon:26.6303,il:"Edirne",ilce:"Keşan"},
  "Uzunköprü":{lat:41.2686,lon:26.6894,il:"Edirne",ilce:"Uzunköprü"},
  "İpsala":{lat:40.9167,lon:26.3833,il:"Edirne",ilce:"İpsala"},
  "Havsa":{lat:41.55,lon:26.8167,il:"Edirne",ilce:"Havsa"},
  "Meriç":{lat:41.1889,lon:26.4167,il:"Edirne",ilce:"Meriç"},
  "Enez":{lat:40.725,lon:26.0833,il:"Edirne",ilce:"Enez"},
  "Süloğlu":{lat:41.7667,lon:26.9,il:"Edirne",ilce:"Süloğlu"},
  "Lalapaşa":{lat:41.8389,lon:26.7361,il:"Edirne",ilce:"Lalapaşa"},
  "Kırklareli Merkez":{lat:41.7333,lon:27.2167,il:"Kırklareli",ilce:"Merkez"},
  "Lüleburgaz":{lat:41.4056,lon:27.3569,il:"Kırklareli",ilce:"Lüleburgaz"},
  "Babaeski":{lat:41.4333,lon:27.0917,il:"Kırklareli",ilce:"Babaeski"},
  "Vize":{lat:41.5736,lon:27.7667,il:"Kırklareli",ilce:"Vize"},
  "Pınarhisar":{lat:41.6222,lon:27.5139,il:"Kırklareli",ilce:"Pınarhisar"},
  "Demirköy":{lat:41.8222,lon:27.7583,il:"Kırklareli",ilce:"Demirköy"},
  "Pehlivanköy":{lat:41.35,lon:27.1833,il:"Kırklareli",ilce:"Pehlivanköy"},
  "Kofçaz":{lat:41.9333,lon:27.1833,il:"Kırklareli",ilce:"Kofçaz"}
};

const trLower = s => (s||"").toString().toLocaleLowerCase("tr-TR").trim();
const asciiKey = s => trLower(s).replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9.\s]/g," ").replace(/\s+/g," ").trim();
const properTr = s => trLower(s).replace(/\s+/g," ").split(" ").filter(Boolean).map(w=>w.charAt(0).toLocaleUpperCase("tr-TR")+w.slice(1)).join(" ").trim();
function parseCoord(v){ if(!v) return ""; const s=String(v).trim().replace(/,/g,"."); const m=s.match(/^\s*([+-]?\d+(?:\.\d+)?)\s*(?:[,;/\s]+|-)\s*([+-]?\d+(?:\.\d+)?)\s*$/); if(!m) return ""; const lat=parseFloat(m[1]), lon=parseFloat(m[2]); if(!isFinite(lat)||!isFinite(lon)||(lat===0&&lon===0)) return ""; return `${lat.toFixed(6)},${lon.toFixed(6)}`; }
function mapsUrl(coord,addr,group,il){ const c=parseCoord(coord); if(c) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c)}`; const q=`${addr||""} ${group||""} ${il||"Edirne"}`.trim(); return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`; }

let dynamicCoords = {};
function getCoord(tes, fb){ const t=String(tes||"").replace(/\D/g,""); if(t&&dynamicCoords[t]) return dynamicCoords[t]; return parseCoord(fb); }
function pick(row, keys){ if(!row) return ""; for(const k of Object.keys(row)){ const ak=asciiKey(k); if(!ak||ak.startsWith("unnamed")) continue; if(keys.some(t=>ak===asciiKey(t)||ak.includes(asciiKey(t)))){ const v=String(row[k]??"").trim(); if(v&&v.toLowerCase()!=="nan") return v; } } return ""; }
function detectDistrict(text){ const n=asciiKey(text||""); const isK=n.includes("kirklareli"); let base=isK?"Kırklareli Merkez":"Edirne Merkez"; for(const [key,meta] of Object.entries(DISTRICTS)){ const ik=asciiKey(meta.ilce); if(ik!=="merkez" && new RegExp(`(^|[^a-z0-9])${ik}([^a-z0-9]|$)`).test(n)) return key; } return base; }

function normalizeJob(raw,key){
  const rawText=[raw.rawAddress,raw.adres,raw.ADRES,raw.address,raw.settlement,raw.district,raw.aboneAdi].filter(Boolean).join(" | ");
  let tes=String(raw.tesisatNo||raw["Tesisat No"]||"").replace(/\D/g,"").trim();
  let seri=String(raw.seriNo||raw["Seri No"]||"").trim();
  if(!tes){ const m=rawText.match(/\b(\d{7,12})\b/); if(m) tes=m[1]; }
  const coord=getCoord(tes, raw.koordinat||raw["KOORDİNAT"]||"");
  const district=DISTRICTS[raw.district]?raw.district:detectDistrict(rawText);
  const meta=DISTRICTS[district]||{il:"Edirne",ilce:district};
  const isKoy=/\bkoy\b|\bköy/i.test(rawText);
  const settRaw=raw.settlement||raw["Mahalle"]||raw["Köy"]||"";
  const settlement=settRaw?properTr(settRaw):`${meta.ilce} Merkez`;
  const cat=isKoy?"KOY":"MAHALLE";
  const mNorm=asciiKey(`${raw.meterType||""} ${rawText}`);
  const meter=(mNorm.includes("tri")||mNorm.includes("trifaze"))?"TRI":"MONO";
  const title=tes?`Tesisat: ${tes}`:(seri?`Sayaç: ${seri}`:properTr(raw.aboneAdi||settlement));
  return {id:String(raw.id||key),tesisatNo:tes,seriNo:seri,koordinat:coord,displayTitle:title,district,il:meta.il,category:cat,settlement:isKoy?`${settlement} Köyü`:`${settlement} Mah.`,openAddress:raw.rawAddress||raw.adres||`${settlement}, ${meta.ilce} / ${meta.il}`,meterType:meter,completed:!!raw.completed,completedAt:raw.completedAt||null};
}
function classifyFault(row){
  const tes=pick(row,["tesisat","abone","sozlesme","numara"]).replace(/\D/g,"").trim();
  const rawAddress=pick(row,["adres","mahalle","koy","sokak","cadde"])||"";
  const ilRaw=pick(row,["il","sehir"])||"";
  const plan=pick(row,["planlama grubu2","planlama","grup","ilce","bolge"])||ilRaw||"Genel";
  let personel=pick(row,["ekip","personel","gorevli","okuyucu","saha","sorumlu","ad soyad"])||"Bilinmeyen Personel";
  const modemSeri=pick(row,["modem seri"])||""; const modemMarka=pick(row,["modem marka"])||"";
  const sayacSeri=pick(row,["sayac seri","sayaç seri","seri"])||""; const sayacMarka=pick(row,["sayac marka","sayaç marka","marka"])||"";
  const durum=pick(row,["endeks olmama nedeni","durum","ariza","aciklama","not","sebep","hata"])||"Sebep Belirtilmemiş";
  const coord=getCoord(tes, pick(row,["koordinat","enlem","boylam"]));
  const flags=[];
  if(!/\b(?:MAH|KÖY|KOY)\b/i.test(rawAddress)) flags.push("MISSING_SETTLEMENT");
  if(/^(?:KEŞAN|LÜLEBURGAZ)$/i.test(ilRaw)) flags.push("IL_AS_DISTRICT");
  if(/-\s*-/.test(rawAddress)||rawAddress.length<18) flags.push("DASH_OR_TRUNCATED");
  if(durum!=="Sebep Belirtilmemiş") flags.push("METER_ERR");
  return {id:String(row.id||`fault_${Date.now()}_${Math.random().toString(36).slice(2,7)}`).replace(/[#.$\/\[\]]/g,"_"),tesisatNo:tes,personel:properTr(personel),ilRaw,planGrubu:plan,rawAddress,modemSeri,modemMarka,sayacSeri,sayacMarka,durumNotu:durum,koordinat:coord,flags};
}
function mergeByTes(existing,incoming){
  const map=new Map(), order=[]; let merged=0, added=0;
  const keyOf=(it,i)=>{ const t=String(it.tesisatNo||"").replace(/\D/g,""); if(t) return `tes_${t}`; const s=String(it.seriNo||it.sayacSeri||"").trim(); if(s) return `ser_${s}`; return `row_${i}`; };
  (existing||[]).forEach((it,i)=>{ const k=keyOf(it,i); map.set(k,{...it}); order.push(k); });
  (incoming||[]).forEach((it,i)=>{ const k=keyOf(it,order.length+i); if(map.has(k)){ const p=map.get(k); map.set(k,{...p,...it,tesisatNo:it.tesisatNo||p.tesisatNo,koordinat:it.koordinat||p.koordinat,completed:p.completed||it.completed}); merged++; } else { map.set(k,{...it}); order.push(k); added++; } });
  return {items:order.map(k=>map.get(k)),mergedCount:merged,addedCount:added};
}

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let allJobs=[], filteredJobs=[], visibleLimit=PAGE_SIZE, selCat="ALL", selDist="ALL", selSett="ALL", selMeter="ALL", sortMode="DEFAULT", searchQ="", showDone=false, isAdmin=false;
let allFaults=[], doneFaults=[], filteredFaults=[], faultLimit=PAGE_SIZE, selFPerson="ALL", selFGroup="ALL", selFReason="ALL", selFType="ALL", faultQ="", doneFaultQ="", pendingId=null, selReason="";

const $ = id => document.getElementById(id);
const els = { sync:$("syncStatus"), counter:$("doneCounter"), jobs:$("jobsContainer"), faultBox:$("faultContainer"), doneFaultBox:$("doneFaultContainer") };

}
function switchFaultSub(s){

$("tabSahaBtn").onclick=()=>switchModule("SAHA");
$("tabFaultBtn").onclick=()=>switchModule("FAULT");
$("faultActiveBtn").onclick=()=>switchFaultSub("ACTIVE");
$("faultDoneBtn").onclick=()=>switchFaultSub("DONE");
$("menuBtn").onclick=()=>{ $("menuModal").classList.add("open"); $("pinInput").focus(); };

$("logoutBtn").onclick=()=>{ isAdmin=false; $("adminPanel").classList.add("hidden"); };

$("clearBtn").onclick=()=>{ if(!confirm("Tüm kayıtlar silinsin mi?")) return; allJobs=[]; allFaults=[]; doneFaults=[]; saveAll(true); };
$("repairBtn").onclick=()=>{ const r1=mergeByTes([], allJobs); allJobs=r1.items; const r2=mergeByTes([], allFaults); allFaults=r2.items; saveAll(true); $("adminStatus").textContent=`✅ Birleştirildi: ${r1.mergedCount+r2.mergedCount} tekrar giderildi.`; };

function saveAll(push=false){
  try{ localStorage.setItem("tredas_saha", JSON.stringify(allJobs)); localStorage.setItem("tredas_fault", JSON.stringify(allFaults)); localStorage.setItem("tredas_donefault", JSON.stringify(doneFaults)); }catch(e){}
  updateBadges(); populateFilters(); applyFilters(); applyFaultFilters();
  if(push){ const o1={}; allJobs.slice(0,3500).forEach((j,i)=>o1[j.id||`j${i}`]=j); set(ref(db,`${DB_PATH}/jobs`),o1).catch(()=>{}); const o2={}; allFaults.slice(0,3500).forEach((f,i)=>o2[f.id||`f${i}`]=f); set(ref(db,`${DB_PATH}/fault_addresses`),o2).catch(()=>{}); const o3={}; doneFaults.slice(0,500).forEach((f,i)=>o3[f.id||`d${i}`]=f); set(ref(db,`${DB_PATH}/completed_faults`),o3).catch(()=>{}); }

function updateBadges(){
  $("faultBadge").textContent=allFaults.length; $("doneFaultBadge").textContent=doneFaults.length;
  $("faultActiveCount").textContent=allFaults.length; $("faultDoneCount").textContent=doneFaults.length;

function populateFilters(){
  const dists=[...new Set(allJobs.map(j=>j.district).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));

  $("settlementSelect").innerHTML=`<option value="ALL">Tüm Mahalle / Köyler</option>`+setts.map(s=>`<option value="${s}">${s}</option>`).join("");
  $("settlementSelect").value=selSett;

  $("faultPersonSelect").value=selFPerson;
  const groups=[...new Set(allFaults.map(f=>f.planGrubu).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));
  $("faultGroupSelect").innerHTML=`<option value="ALL">Tüm Gruplar / İlçeler</option>`+groups.map(g=>`<option value="${g}">${g}</option>`).join("");
  $("faultGroupSelect").value=selFGroup;
  const reasons=[...new Set(allFaults.map(f=>f.durumNotu).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));
  $("faultReasonSelect").innerHTML=`<option value="ALL">Tüm İş / Arıza Nedenleri</option>`+reasons.map(r=>`<option value="${r}">${r}</option>`).join("");
  $("faultReasonSelect").value=selFReason;
  $("faultPersonPills").innerHTML=persons.map(p=>`<button class="d-pill ${selFPerson===p?"active":""}" data-p="${p}">${p} (${allFaults.filter(f=>f.personel===p).length})</button>`).join("")||`<span style="color:var(--muted)">Henüz personel yok</span>`;
  document.querySelectorAll("#faultPersonPills .d-pill").forEach(b=>b.onclick=()=>{ selFPerson=b.dataset.p; saveAll(false); });
  const dl=$("personDatalist"); dl.innerHTML=persons.map(p=>`<option value="${p}"></option>`).join("");

function sortByRota(list){
  return [...list].sort((a,b)=>{
    const d=(a.district||"").localeCompare(b.district||"","tr"); if(d!==0) return d;
    const s=(a.settlement||"").localeCompare(b.settlement||"","tr"); if(s!==0) return s;
    return (a.tesisatNo||"").localeCompare(b.tesisatNo||"");
  });
}

function applyFilters(){
  let list=[...allJobs];
  if(selCat!=="ALL") list=list.filter(j=>j.category===selCat);
  if(selDist!=="ALL") list=list.filter(j=>j.district===selDist);
  if(selSett!=="ALL") list=list.filter(j=>j.settlement===selSett);
  if(selMeter!=="ALL") list=list.filter(j=>j.meterType===selMeter);
  if(searchQ){ const q=asciiKey(searchQ); list=list.filter(j=>asciiKey(`${j.tesisatNo} ${j.seriNo} ${j.settlement} ${j.openAddress} ${j.district} ${j.displayTitle}`).includes(q)); }
  if(!showDone) list=list.filter(j=>!j.completed);
  if(sortMode==="SETTLEMENT") list.sort((a,b)=>a.settlement.localeCompare(b.settlement,"tr"));
  else if(sortMode==="TESISAT") list.sort((a,b)=>a.tesisatNo.localeCompare(b.tesisatNo));
  else if(sortMode==="ROTA") list=sortByRota(list);
  filteredJobs=list;
  const done=allJobs.filter(j=>j.completed).length; els.counter.textContent=`${done} / ${allJobs.length}`;
  const pct=allJobs.length?Math.round(done/allJobs.length*100):0; $("percentLabel").textContent=`%${pct}`; $("progressFill").style.width=`${pct}%`;
  $("filteredLabel").textContent=`Ekranda Kalan: ${list.length}`;
  const shown=list.slice(0,visibleLimit);
  if(!shown.length){ els.jobs.innerHTML=`<div class="empty">Kayıt bulunamadı. ${isAdmin?"Excel yükleyin.":""}</div>`; }
  else els.jobs.innerHTML=shown.map(renderJob).join("");
  $("loadMoreWrap").classList.toggle("hidden", list.length<=visibleLimit);
}
function renderJob(j){
  const tag=j.category==="KOY"?`<span class="tag tag-k">🌾 Köy</span>`:`<span class="tag tag-m">🏙️ Mahalle</span>`;
  const status=j.completed?`<span class="tag tag-d">✓ Tamam</span>`:`<span class="tag tag-e">Bekliyor</span>`;
  const maps=mapsUrl(j.koordinat,j.openAddress,j.district,j.il);
  return `<div class="job ${j.completed?"done":""}">
  <div class="job-top"><span class="job-title">${j.displayTitle}</span><span style="display:flex;gap:4px">${tag}${status}</span></div>
  <div class="job-meta">${j.settlement} • ${j.district} / ${j.il} • ${j.meterType==="TRI"?"Trifaze":"Monofaze"} ${j.seriNo?`• Seri: ${j.seriNo}`:""} ${j.koordinat?`• 📍 ${j.koordinat}`:""}</div>
  <div class="info">${j.openAddress}</div>
  <div class="actions">
  <a class="btn btn-i" href="${maps}" target="_blank">📍 Haritada Aç</a>
  <a class="btn btn-sec" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(j.koordinat||j.openAddress)}" target="_blank">🧭 Yol Tarifi</a>
  <button class="btn ${j.completed?"btn-sec":"btn-s"}" onclick="window.__toggleJob('${j.id}')">${j.completed?"↩ Geri Al":"✓ Tamamla"}</button>
  </div></div>`;
}
window.__toggleJob=(id)=>{ const j=allJobs.find(x=>x.id===id); if(!j) return; j.completed=!j.completed; j.completedAt=j.completed?Date.now():null; saveAll(true); };

function applyFaultFilters(reset=false){
  if(reset) faultLimit=PAGE_SIZE;
  let list=[...allFaults];
  if(selFPerson!=="ALL") list=list.filter(f=>f.personel===selFPerson);
  if(selFGroup!=="ALL") list=list.filter(f=>f.planGrubu===selFGroup);
  if(selFReason!=="ALL") list=list.filter(f=>f.durumNotu===selFReason);
  if(selFType!=="ALL") list=list.filter(f=>(f.flags||[]).includes(selFType));
  if(faultQ){ const q=asciiKey(faultQ); list=list.filter(f=>asciiKey(`${f.tesisatNo} ${f.personel} ${f.planGrubu} ${f.rawAddress} ${f.durumNotu} ${f.sayacSeri}`).includes(q)); }
  filteredFaults=list;
  $("faultCountLabel").textContent=`Listelenen: ${list.length}`; $("faultTotalLabel").textContent=`Toplam: ${allFaults.length}`;
  const shown=list.slice(0,faultLimit);
  if(!shown.length) $("faultContainer").innerHTML=`<div class="empty">Hatalı kayıt yok.</div>`;
  else $("faultContainer").innerHTML=shown.map(renderFault).join("");
  $("faultLoadMoreWrap").classList.toggle("hidden", list.length<=faultLimit);
}
function renderFault(f){
  const maps=mapsUrl(f.koordinat,f.rawAddress,f.planGrubu,f.ilRaw);
  return `<div class="job err">
  <div class="job-top"><span class="job-title">Tesisat: ${f.tesisatNo||"-"}</span><span class="tag tag-e">⚠️ Hatalı</span></div>
  <div class="job-meta">👷 ${f.personel} • ${f.planGrubu} ${f.ilRaw?`• ${f.ilRaw}`:""} ${f.sayacSeri?`• Sayaç: ${f.sayacSeri}`:""} ${f.modemSeri?`• Modem: ${f.modemSeri}`:""}</div>
  <div class="info"><span style="color:#fbbf24;font-weight:700">Adres:</span> ${f.rawAddress||"-"}<br><span style="color:#34d399;font-weight:800">İş / Hata:</span> ${f.durumNotu||"-"}<br><span style="color:var(--muted);font-size:11.5px">${f.koordinat?`📍 ${f.koordinat}`:"Koordinat yok"}</span></div>
  <div class="actions">
  <a class="btn btn-i" href="${maps}" target="_blank">📍 Haritada Aç</a>
  <button class="btn btn-s" onclick="window.__openFault('${f.id}')">✓ Tamamla</button>
  <button class="btn btn-d" onclick="window.__delFault('${f.id}')">🗑️ Sil</button>
  </div></div>`;
}
window.__delFault=(id)=>{ if(!confirm("Bu hatalı kayıt silinsin mi?")) return; allFaults=allFaults.filter(f=>f.id!==id); saveAll(true); };
window.__openFault=(id)=>{ const t=allFaults.find(x=>x.id===id); if(!t) return; pendingId=id; selReason=""; $("actorInput").value=t.personel!=="Bilinmeyen Personel"?t.personel:""; $("errorInput").value=t.durumNotu||""; $("reasonInput").value=""; document.querySelectorAll(".reason-btn").forEach(b=>b.classList.remove("sel")); $("faultTargetInfo").textContent=`Tesisat: ${t.tesisatNo||"-"} • Ekip: ${t.personel} • İş: ${t.durumNotu}`; $("faultModal").classList.add("open"); };
document.querySelectorAll(".reason-btn").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".reason-btn").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); selReason=b.dataset.reason; const cur=$("reasonInput").value.trim(); $("reasonInput").value=cur?`${selReason} - ${cur}`:selReason; });
$("cancelFaultBtn").onclick=()=>{ pendingId=null; $("faultModal").classList.remove("open"); };
$("confirmFaultBtn").onclick=()=>{
  if(!pendingId) return;
  const actor=$("actorInput").value.trim()||"Belirtilmedi";
  const err=$("errorInput").value.trim()||"Adres / okuma hatası";
  const note=($("reasonInput").value||selReason||"").trim();
  if(!note){ $("reasonInput").focus(); return; }
  const idx=allFaults.findIndex(f=>f.id===pendingId); if(idx<0) return;
  const item=allFaults[idx]; allFaults.splice(idx,1);
  const now=Date.now();
  doneFaults.unshift({...item,completedBy:actor,detectedError:err,reasonNote:note,completedAtMs:now,expiresAt:now+RETENTION_MS});
  pendingId=null; $("faultModal").classList.remove("open"); saveAll(true); switchFaultSub("DONE");
};
function renderDoneFaults(){
  let list=[...doneFaults];
  const now=Date.now(); list=list.filter(f=>!f.expiresAt||now<f.expiresAt);
  if(doneFaultQ){ const q=asciiKey(doneFaultQ); list=list.filter(f=>asciiKey(`${f.tesisatNo} ${f.completedBy} ${f.durumNotu} ${f.reasonNote}`).includes(q)); }
  if(!list.length){ $("doneFaultContainer").innerHTML=`<div class="empty">Tamamlanan hatalı kayıt yok.</div>`; return; }
  $("doneFaultContainer").innerHTML=list.slice(0,60).map(f=>`<div class="job done"><div class="job-top"><span class="job-title">Tesisat: ${f.tesisatNo||"-"}</span><span class="tag tag-d">✓ Tamam</span></div><div class="job-meta">👷 ${f.completedBy||"-"} • ${new Date(f.completedAtMs||Date.now()).toLocaleDateString("tr-TR")}</div><div class="info"><span style="color:#fbbf24;font-weight:700">Hata:</span> ${f.detectedError||f.durumNotu}<br><span style="color:#34d399;font-weight:800">Yapılan:</span> ${f.reasonNote||"-"}<br><span style="color:var(--muted);font-size:11.5px">${f.rawAddress||""}</span></div></div>`).join("");
}

document.querySelectorAll(".cat-btn").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("active")); b.classList.add("active"); selCat=b.dataset.cat; visibleLimit=PAGE_SIZE; applyFilters(); });
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active")); b.classList.add("active"); selMeter=b.dataset.meter; applyFilters(); });
$("districtSelect").onchange=e=>{ selDist=e.target.value; selSett="ALL"; populateFilters(); applyFilters(); };
$("settlementSelect").onchange=e=>{ selSett=e.target.value; applyFilters(); };

$("faultReasonSelect").onchange=e=>{ selFReason=e.target.value; applyFaultFilters(true); };
$("faultTypeSelect").onchange=e=>{ selFType=e.target.value; applyFaultFilters(true); };
$("faultSearchInput").oninput=e=>{ faultQ=e.target.value; applyFaultFilters(true); };

async function readExcel(file){
  const data=await file.arrayBuffer(); const wb=XLSX.read(data,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]]; return XLSX.utils.sheet_to_json(ws,{defval:""});
}
$("excelInput").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return; $("adminStatus").textContent="⏳ Okunuyor...";
  try{
    const rows=await readExcel(f);
    let added=0; rows.forEach(r=>{ const c=pick(r,["koordinat","enlem","boylam"]); const t=pick(r,["tesisat","abone","sozlesme"]).replace(/\D/g,""); if(t&&parseCoord(c)) dynamicCoords[t]=parseCoord(c); });
    const jobs=rows.map((r,i)=>normalizeJob({id:`j_${Date.now()}_${i}`,tesisatNo:pick(r,["tesisat","abone"]),seriNo:pick(r,["seri"]),settlement:pick(r,["mahalle","koy","yerlesim"]),district:pick(r,["ilce","planlama"]),rawAddress:pick(r,["adres"]),koordinat:pick(r,["koordinat"]),meterType:pick(r,["sayac tipi","faz"]),aboneAdi:pick(r,["abone adi","musteri"])} ,`j_${i}`)).filter(j=>j.tesisatNo||j.seriNo||j.openAddress);
    const res=mergeByTes(allJobs,jobs); allJobs=res.items;
    $("adminStatus").textContent=`✅ Saha: ${res.mergedCount} güncellendi, ${res.addedCount} yeni eklendi. Toplam: ${allJobs.length}`;
    saveAll(true);
  }catch(err){ $("adminStatus").textContent="⚠️ Hata: "+err.message; }
  e.target.value="";
};
$("faultExcelInput").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return; $("adminStatus").textContent="⏳ Hatalı Excel okunuyor...";
  try{
    const rows=await readExcel(f);
    const faults=rows.map(r=>classifyFault(r)).filter(x=>x.rawAddress||x.tesisatNo||x.koordinat);
    const res=mergeByTes(allFaults,faults); allFaults=res.items;
    $("adminStatus").textContent=`✅ Hatalı: ${res.mergedCount} güncellendi, ${res.addedCount} yeni eklendi. Toplam: ${allFaults.length}`;
    saveAll(true); switchModule("FAULT");
  }catch(err){ $("adminStatus").textContent="⚠️ Hata: "+err.message; }
  e.target.value="";
};

// İlk yükleme - Local + Firebase
try{ const lj=JSON.parse(localStorage.getItem("tredas_saha")||"[]"); if(Array.isArray(lj)&&lj.length) allJobs=lj; const lf=JSON.parse(localStorage.getItem("tredas_fault")||"[]"); if(Array.isArray(lf)) allFaults=lf; const ld=JSON.parse(localStorage.getItem("tredas_donefault")||"[]"); if(Array.isArray(ld)) doneFaults=ld; }catch(e){}
saveAll(false);
onValue(ref(db,DB_PATH),(snap)=>{
  const v=snap.val();
  if(!v) { $("syncStatus").textContent="✅ Canlı Bağlı - Henüz Veri Yok"; $("syncStatus").className="sync sync-ok"; return; }
  if(v.jobs){ const arr=Array.isArray(v.jobs)?v.jobs:Object.values(v.jobs); allJobs=arr.map((j,i)=>normalizeJob(j,i)); }
  if(v.fault_addresses){ const arr=Array.isArray(v.fault_addresses)?v.fault_addresses:Object.values(v.fault_addresses); allFaults=arr; }
  if(v.completed_faults){ const arr=Array.isArray(v.completed_faults)?v.completed_faults:Object.values(v.completed_faults); doneFaults=arr; }
  $("syncStatus").textContent="✅ Canlı Bağlı"; $("syncStatus").className="sync sync-ok";
  saveAll(false);
},(err)=>{ $("syncStatus").textContent="⚠️ Bağlantı Hatası: "+err.message; $("syncStatus").className="sync sync-err"; });
